name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    name: Deterministic ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite: [static, fast, node-fast, integration, native-pi, package, source, system-services]
    steps:
      - name: Configure private test root
        shell: bash
        # The runner context is unavailable in job-level env expressions.
        run: echo "CORAGENT_TEST_ENV_ROOT=$RUNNER_TEMP/ra" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
      - name: Install coding tool prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep fd-find
          # Ubuntu names the binary fdfind; Pi resolves the canonical fd name.
          tools="$CORAGENT_TEST_ENV_ROOT/toolchains/bin"
          mkdir -p "$tools"
          ln -s "$(command -v fdfind)" "$tools/fd"
          echo "$tools" >> "$GITHUB_PATH"
          rg --version
          "$tools/fd" --version
      - name: Enable isolated test namespaces on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Start an owned user manager when absent
        if: matrix.suite == 'system-services'
        shell: bash
        run: |
          mkdir -p "$CORAGENT_TEST_ENV_ROOT/registry"
          unit="user@$(id -u).service"
          if ! systemctl is-active --quiet "$unit"; then
            sudo systemctl start "$unit"
            touch "$CORAGENT_TEST_ENV_ROOT/registry/ci-owns-user-manager"
          fi
      - name: Prepare locked dependencies
        shell: bash -el {0}
        run: |
          export CORAGENT_TEST_CONDA="$(command -v conda)"
          python3 tools/test/runner.py prepare
      - name: Isolated suite
        shell: bash -el {0}
        run: python3 tools/test/runner.py ${{ matrix.suite }}
      - name: Audit and clean owned resources
        if: always()
        shell: bash -el {0}
        run: python3 tools/test/runner.py doctor
      - name: Stop the manager only if this job created it
        if: always() && matrix.suite == 'system-services'
        shell: bash
        run: |
          marker="$CORAGENT_TEST_ENV_ROOT/registry/ci-owns-user-manager"
          if test -f "$marker"; then
            sudo systemctl stop "user@$(id -u).service"
            rm "$marker"
          fi
      # Private test roots, logs, databases and caches are never uploaded.
