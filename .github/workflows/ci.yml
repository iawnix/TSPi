name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript-and-package:
    name: TypeScript and package contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:package
      - name: Prepare pinned Pi source
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(python3 scripts/prepare_pi_source.py --install "$RUNNER_TEMP/tspi")"
          echo "TSPI_PI_SOURCE=$source_root" >> "$GITHUB_ENV"
      - run: npm run test:native-pi

  python-fast:
    name: Python fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ts-agent-skill
          environment-file: environment.yml
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
      - shell: bash -el {0}
        run: python tools/test/runner.py fast -- -q
      - shell: bash -el {0}
        run: python3 tools/lint_public_surface.py
      - shell: bash -el {0}
        run: python3 tools/lint_skills.py

  python-source:
    name: Managed source runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ts-agent-skill
          environment-file: environment.yml
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
      - shell: bash -el {0}
        run: >-
          python tools/test/runner.py
          --base-prefix "$CONDA_PREFIX"
          --conda-root "$(conda info --base)"
          source -- -q
