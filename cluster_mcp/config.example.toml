[workspace]
root = "/path/to/cluster-mcp-workspaces"
max_upload_bytes = 21474836480
max_chunk_bytes = 4194304
min_free_bytes = 1073741824
upload_expiry_hours = 24

[scheduler]
backend = "openpbs"
allowed_queues = ["workq"]
gpu_queues = []
max_nodes = 1
allow_other_users = false
allow_submission = true
allow_job_control = true
require_gpu_devices = false
command_timeout_seconds = 30
max_command_output_bytes = 16777216

[scheduler.commands]
qstat = "/opt/pbs/bin/qstat"
qsub = "/opt/pbs/bin/qsub"
qdel = "/opt/pbs/bin/qdel"
qhold = "/opt/pbs/bin/qhold"
qrls = "/opt/pbs/bin/qrls"
qalter = "/opt/pbs/bin/qalter"
pbsnodes = "/opt/pbs/bin/pbsnodes"

[audit]
enabled = true
path = "/path/to/cluster-mcp-workspaces/.cluster_mcp/audit.jsonl"

[auth]
required = true
principals_file = "/path/to/private/auth.toml"

[http]
host = "127.0.0.1"
port = 8765
path = "/mcp"
public_url = "http://127.0.0.1:8765/mcp"
principal = "pi-ts"
token_env_var = "CLUSTER_MCP_HTTP_TOKEN"
allowed_client_networks = ["127.0.0.1/32", "::1/128"]
stateless = true
json_response = true
