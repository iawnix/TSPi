# All addresses are fictional. Save your private copy as email.toml.
# SMTP authorization codes belong in a separate mode-0600 file, not this file.
[notifications.email]
enabled = true
provider = "smtp"
preset = "custom"
host = "smtp.example.invalid"
port = 465
security = "ssl"
recipient = "recipient@example.invalid"
username = "sender@example.invalid"
password_file = "smtp-password" # Relative to this configuration directory.
# For QQ/163, set preset = "qq"/"163" and remove host, port and security
# to use the provider defaults. Use an SMTP authorization code, not a login password.
# Alternatively, replace password_file with password_env = "RESEARCH_AGENT_EMAIL_PASSWORD".
