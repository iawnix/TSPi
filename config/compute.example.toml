# Unified compute configuration.
# Copy to the installation-owned .pi/compute.toml and edit the providers
# available on each execution platform. A profile is one software provider
# platform; kind controls how jobs reach it.

default_profile = "local"

[profiles.local]
kind = "local"

[profiles.local.software.gaussian]
command = "/home/iaw/soft/gaussian/current/g16/g16"
activation_script = "/home/iaw/soft/gaussian/activate_gaussian16.sh"

[profiles.local.software.xtb]
command = "/home/iaw/soft/xtb/current/bin/xtb"
activation_script = "/home/iaw/soft/xtb/current/activate_xtb.sh"

[profiles.local.software.ase_neb_xtb]
command = "/home/iaw/soft/xtb/current/bin/xtb"
activation_script = "/home/iaw/soft/xtb/current/activate_xtb.sh"

[profiles.local.software.crest]
command = "/home/iaw/soft/crest/current/bin/crest"
activation_script = "/home/iaw/soft/crest/activate_crest.sh"

# Add one or more remote software platforms below. Commands are arrays
