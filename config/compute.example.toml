# Unified compute configuration.
# Copy to the installation-owned .pi/compute.toml and edit the backend bindings
# available in each compute environment. The kind selects the execution platform.

default_environment = "local"

[environments.local]
kind = "local"

[environments.local.backends.gaussian]
command = "/home/iaw/soft/gaussian/current/g16/g16"
activation_script = "/home/iaw/soft/gaussian/activate_gaussian16.sh"

[environments.local.backends.xtb]
command = "/home/iaw/soft/xtb/current/bin/xtb"
activation_script = "/home/iaw/soft/xtb/current/activate_xtb.sh"

[environments.local.backends.ase_neb_xtb]
command = "/home/iaw/soft/xtb/current/bin/xtb"
activation_script = "/home/iaw/soft/xtb/current/activate_xtb.sh"

[environments.local.backends.crest]
command = "/home/iaw/soft/crest/current/bin/crest"
activation_script = "/home/iaw/soft/crest/activate_crest.sh"

# Add one or more remote environments below. Commands are arrays
