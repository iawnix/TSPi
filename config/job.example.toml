# Job execution bindings; edit these example target paths before installation.
# For automatic provisioning, start with target/solver settings and select
# --job-profile TARGET:PROFILE in install.sh; omit backend Python bindings.
# The explicit bindings below instead demonstrate existing managed environments.
# Copy to the installation-owned etc/job.toml and edit the backend bindings
# available in each compute environment. The kind selects the execution platform.

default_environment = "local"

[environments.local]
kind = "local"

[environments.local.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/research-agent/envs/wrapper-20261009"
lock_ref = "/opt/research-agent/locks/wrapper.lock"

# These Python-only methods use the selected target's RDKit/NumPy environment.
[environments.local.backends.structure]
# The installer binds its etc/name-resolver.toml here when no explicit resolver
# environment is supplied. Remote targets need their own target-local path.
[environments.local.backends.structure.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/research-agent/envs/structure-20261009"
lock_ref = "/opt/research-agent/locks/structure.lock"
[environments.local.backends.validation]
[environments.local.backends.validation.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/research-agent/envs/structure-20261009"
lock_ref = "/opt/research-agent/locks/structure.lock"

[environments.local.backends.gaussian]
command = "/opt/gaussian/g16/g16"
activation_script = "/opt/gaussian/activate.sh"
[environments.local.backends.gaussian.environment]
GAUSS_SCRDIR = "{scratch}"

[environments.local.backends.xtb]
command = "/opt/xtb/bin/xtb"
activation_script = "/opt/xtb/activate.sh"

# CF22D uses its own complete Conda lock; no custom LD_PRELOAD is needed.
[environments.local.backends.pyscf]

[environments.local.backends.pyscf.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/research-agent/envs/cf22d-20261009"
lock_ref = "/opt/research-agent/locks/cf22d.lock"

# Local remains the default. Select the remote explicitly with
# platform = "remote" in the prepared Job request.
# Remote paths below must exist on the remote host.
# Commands are arrays because the remote scheduler script may need fixed arguments.

[environments.remote]
kind = "remote"
ssh_host = "research-cluster"
scheduler = "torque"
remote_root = "/scratch/research-agent/jobs"
allowed_queues = ["batch", "fat", "fata"]
connect_timeout_seconds = 15
command_timeout_seconds = 60
transfer_timeout_seconds = 3600

# Choose an installation-approved queue explicitly; allowed_queues is not a default.
[environments.remote.submission]
queue = "batch"
queue_wait_seconds = 900
[environments.remote.submission.resources]
cpus = 1
memory_mb = 4096
walltime = "01:00:00"

[environments.remote.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/research-agent/envs/wrapper-20261009"
lock_ref = "/opt/research-agent/locks/wrapper.lock"

[environments.remote.backends.structure]
[environments.remote.backends.structure.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/research-agent/envs/structure-20261009"
lock_ref = "/opt/research-agent/locks/structure.lock"
[environments.remote.backends.validation]
[environments.remote.backends.validation.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/research-agent/envs/structure-20261009"
lock_ref = "/opt/research-agent/locks/structure.lock"

[environments.remote.commands]
qsub = "qsub"
qstat = "qstat"
qdel = "qdel"
checkjob = "checkjob"

[environments.remote.backends.gaussian]
command = ["g16"]
activation_script = "/opt/gaussian/activate.sh"
allowed_queues = ["batch", "fat", "fata"]

[environments.remote.backends.xtb]
command = ["/opt/xtb/bin/xtb"]
allowed_queues = ["batch", "fat", "fata"]

[environments.remote.backends.pyscf]

[environments.remote.backends.pyscf.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/research-agent/envs/cf22d-20261009"
lock_ref = "/opt/research-agent/locks/cf22d.lock"

# Optional molecular images; text reports need no rendering libraries.
[environments.local.backends.render.python]
manager = "conda"
conda_executable = "/opt/conda/bin/conda"
prefix = "/opt/research-agent/envs/render-20261009"
lock_ref = "/opt/research-agent/locks/render.lock"
