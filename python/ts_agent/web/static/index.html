<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>TS Research Explorer</title>
  <script>
    (() => {
      const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      let saved = null;
      try { saved = localStorage.getItem("ts-explorer-theme"); } catch (_error) {}
      document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : preferred;
    })();
  </script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Lucide icon geometry is embedded so the read-only explorer works offline. -->
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-roadmap" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15M15 6v15"/></symbol>
    <symbol id="icon-conclusions" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M8.5 14.5A7 7 0 1 1 15.5 14.5c-.9.7-1.5 1.6-1.5 2.5h-4c0-.9-.6-1.8-1.5-2.5Z"/></symbol>
    <symbol id="icon-files" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></symbol>
    <symbol id="icon-validation" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="icon-findings" viewBox="0 0 24 24"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="icon-activity" viewBox="0 0 24 24"><path d="M3 12h4l2-8 4 16 2-8h6"/></symbol>
    <symbol id="icon-graphs" viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="19" r="2"/><path d="m7 7 4 10M17 7l-4 10M7 6h10"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="icon-branch" viewBox="0 0 24 24"><circle cx="6" cy="4" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="20" r="2"/><path d="M6 6v12M8 8c4 0 4-2 8-2"/></symbol>
    <symbol id="icon-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 22h11.6a2 2 0 0 0 1.7-3.5L14 9V3"/><path d="M7.5 15h9"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="icon-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></symbol>
    <symbol id="icon-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M8 11h6"/></symbol>
    <symbol id="icon-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="icon-focus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 12h3M18 12h3M12 3v3M12 18v3"/></symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24"><path d="M4 5h16M7 12h10M10 19h4"/></symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">TSπ</div>
      <div class="brand-copy">
        <div class="brand-title">TS Research Explorer</div>
        <div class="brand-protocol">Research Kernel</div>
      </div>
    </div>
    <div class="workspace-controls">
      <label class="sr-only" for="workspace-select">Workspace</label>
      <select id="workspace-select"></select>
      <button class="icon-button" id="theme-button" type="button" title="Use dark theme" aria-label="Use dark theme">
        <svg class="icon" id="theme-icon" aria-hidden="true"><use href="#icon-moon"/></svg>
      </button>
      <button class="icon-button" id="refresh-button" type="button" title="Refresh workspace" aria-label="Refresh workspace">
        <svg class="icon" id="refresh-icon" aria-hidden="true"><use href="#icon-refresh"/></svg>
      </button>
      <span class="sr-only" id="refresh-status" role="status" aria-live="polite"></span>
      <div class="health" id="health"><span class="health-dot"></span><span id="health-label">Loading</span></div>
    </div>
  </header>

  <div class="app-shell">
    <nav class="sidebar" id="sidebar" aria-label="Research workspace">
      <div class="nav-group-label">Research</div>
      <button class="nav-button active" type="button" data-view="roadmap"><svg class="icon"><use href="#icon-roadmap"/></svg><span>Research Tree</span><span class="nav-count" data-count="phases">0</span></button>
      <button class="nav-button" type="button" data-view="conclusions"><svg class="icon"><use href="#icon-conclusions"/></svg><span>Scientific Conclusions</span><span class="nav-count" data-count="claims">0</span></button>
      <button class="nav-button" type="button" data-view="files"><svg class="icon"><use href="#icon-files"/></svg><span>Research Files</span></button>
      <div class="nav-group-label">Assurance</div>
      <button class="nav-button" type="button" data-view="validation"><svg class="icon"><use href="#icon-validation"/></svg><span>Validation</span><span class="nav-count" data-count="validation">0</span></button>
      <button class="nav-button" type="button" data-view="findings"><svg class="icon"><use href="#icon-findings"/></svg><span>Findings</span><span class="nav-count" data-count="findings">0</span></button>
      <div class="nav-group-label">Operations</div>
      <button class="nav-button" type="button" data-view="activity"><svg class="icon"><use href="#icon-activity"/></svg><span>Activity</span><span class="nav-count" data-count="activity">0</span></button>
      <div class="sidebar-meta" id="sidebar-meta"></div>
    </nav>

    <main class="workspace-main" id="workspace-main">
      <div class="content" id="content"></div>
    </main>
  </div>

  <button class="inspector-backdrop" id="inspector-backdrop" type="button" aria-label="Close details"></button>
  <aside class="inspector" id="inspector" aria-label="Record details" aria-hidden="true">
    <div class="inspector-header">
      <div>
        <div class="inspector-kicker" id="inspector-kicker">Details</div>
        <h2 id="inspector-title">Record</h2>
      </div>
      <button class="icon-button" id="close-inspector" type="button" title="Close details" aria-label="Close details"><svg class="icon"><use href="#icon-close"/></svg></button>
    </div>
    <div class="inspector-body" id="inspector-body"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/research-tree.js" defer></script>
  <script src="/claim-map.js" defer></script>
  <script src="/attempt-timeline.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
