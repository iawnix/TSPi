<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="109.8mm" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TSPi research architecture</title>
  <desc id="desc">An abstract, publication-ready architecture of the TSPi hypothesis-to-proof loop. The Root Agent directs a deterministic Research Kernel, which coordinates bounded capabilities, evidence promotion, validation, scientific outcomes, and read-only Web and Phone projections.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17384D" flood-opacity="0.11"/>
    </filter>
    <linearGradient id="agentGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173D58"/>
      <stop offset="1" stop-color="#2A657E"/>
    </linearGradient>
    <linearGradient id="kernelGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4FBFA"/>
      <stop offset="1" stop-color="#E2F2F0"/>
    </linearGradient>
    <linearGradient id="outcomeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDFC"/>
      <stop offset="1" stop-color="#FFF1EC"/>
    </linearGradient>
    <marker id="arrowNavy" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6 0 12Z" fill="#365B70"/>
    </marker>
    <marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6 0 12Z" fill="#208C86"/>
    </marker>
    <marker id="arrowCoral" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6 0 12Z" fill="#D6654D"/>
    </marker>
    <style>
      text{font-family:Inter,"Noto Sans",Arial,sans-serif}
      .title{font-size:28px;font-weight:700;fill:#12324A;letter-spacing:.15px}
      .subtitle{font-size:15px;font-weight:400;fill:#567182}
      .section{font-size:14px;font-weight:700;fill:#5A7382;letter-spacing:1.25px}
      .label{font-size:18px;font-weight:700;fill:#12324A}
      .subLabel{font-size:16px;font-weight:700;fill:#12324A}
      .body{font-size:15px;font-weight:400;fill:#496675}
      .note{font-size:14px;font-weight:600;fill:#597384;letter-spacing:.15px}
      .white{fill:#FFFFFF}
      .navyFlow{fill:none;stroke:#365B70;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowNavy)}
      .tealFlow{fill:none;stroke:#208C86;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowTeal)}
      .feedback{fill:none;stroke:#D6654D;stroke-width:2.4;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowCoral)}
    </style>
  </defs>

  <rect width="1200" height="720" fill="#FBFCFB"/>
  <rect x="20" y="20" width="1160" height="680" rx="22" fill="#FBFCFB" stroke="#D9E4E6" stroke-width="1.6"/>

  <text x="48" y="61" class="title">TSPi research architecture</text>
  <text x="48" y="87" class="subtitle">A provenance-preserving loop from scientific questions to validated, inspectable conclusions</text>

  <!-- Decision feedback closes the scientific loop. -->
  <path d="M1150 580H1162V106H151V170" class="feedback"/>
  <rect x="746" y="93" width="194" height="25" rx="12.5" fill="#FFF6F2"/>
  <text x="843" y="110" class="note" text-anchor="middle" style="fill:#C0523F">decision · next question</text>

  <text x="48" y="151" class="section">SCIENTIFIC DIRECTION</text>
  <text x="330" y="136" class="section">DETERMINISTIC RESEARCH CORE</text>
  <text x="900" y="151" class="section">READ-ONLY PROJECTIONS</text>

  <!-- Root Agent -->
  <g filter="url(#shadow)">
    <rect x="48" y="170" width="210" height="150" rx="19" fill="url(#agentGradient)"/>
  </g>
  <circle cx="83" cy="211" r="19" fill="#E9C46A"/>
  <path d="M83 223V211M83 211L72 200M83 211L94 200M72 200V193M94 200V193" fill="none" stroke="#173D58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="111" y="217" class="label white">Root Agent</text>
  <text x="70" y="254" class="body white" opacity=".9">Questions · hypotheses</text>
  <text x="70" y="278" class="body white" opacity=".9">Methods · branches · stop</text>
  <rect x="69" y="292" width="167" height="20" rx="10" fill="#FFFFFF" opacity=".13"/>
  <text x="152.5" y="307" class="note white" text-anchor="middle" opacity=".8">SCIENTIFIC REASONING</text>

  <!-- Root proposal to the kernel. -->
  <path d="M258 235H330" class="navyFlow"/>
  <text x="294" y="219" class="note" text-anchor="middle">typed proposal</text>

  <!-- Research Kernel -->
  <g filter="url(#shadow)">
    <rect x="330" y="145" width="500" height="300" rx="22" fill="url(#kernelGradient)" stroke="#6EB9B3" stroke-width="2.2"/>
  </g>
  <circle cx="368" cy="185" r="17" fill="#CFECE8"/>
  <path d="M359 185h18M368 176v18" stroke="#208C86" stroke-width="2.7" stroke-linecap="round"/>
  <text x="396" y="192" class="label">Research Kernel</text>
  <text x="365" y="218" class="body">single workspace · single mutation authority</text>

  <g>
    <rect x="365" y="240" width="130" height="112" rx="15" fill="#FFFFFF" stroke="#208C86" stroke-width="1.8"/>
    <circle cx="430" cy="270" r="16" fill="#D8F1ED"/>
    <path d="M420 276L430 264 440 276M420 276h20M430 264v-7" fill="none" stroke="#208C86" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="430" y="307" class="subLabel" text-anchor="middle">Research graph</text>
    <text x="430" y="331" class="note" text-anchor="middle">Phase · Node · Claim</text>
  </g>
  <g>
    <rect x="515" y="240" width="130" height="112" rx="15" fill="#FFFFFF" stroke="#6C63A8" stroke-width="1.8"/>
    <circle cx="580" cy="270" r="16" fill="#ECE9FA"/>
    <path d="M572 261h13l4 4v15h-17zM585 261v5h5M576 271h9M576 276h7" fill="none" stroke="#6C63A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="580" y="307" class="subLabel" text-anchor="middle">Provenance</text>
    <text x="580" y="331" class="note" text-anchor="middle">Artifacts · ledger</text>
  </g>
  <g>
    <rect x="665" y="240" width="130" height="112" rx="15" fill="#FFFFFF" stroke="#D6654D" stroke-width="1.8"/>
    <circle cx="730" cy="270" r="16" fill="#FBE6E1"/>
    <path d="M720 270l7 7 13-15" fill="none" stroke="#D6654D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="730" y="307" class="subLabel" text-anchor="middle">Validation</text>
    <text x="730" y="331" class="note" text-anchor="middle">ProofSpec · results</text>
  </g>
  <line x1="365" y1="378" x2="795" y2="378" stroke="#A9D5D1" stroke-width="1.7"/>
  <circle cx="391" cy="408" r="7" fill="#208C86"/>
  <text x="410" y="414" class="body">canonical state · immutable evidence · explicit decisions</text>

  <!-- Read-only projections -->
  <g filter="url(#shadow)">
    <rect x="900" y="170" width="250" height="108" rx="18" fill="#FFFFFF" stroke="#4F7E91" stroke-width="1.8"/>
  </g>
  <circle cx="936" cy="211" r="19" fill="#E2F1F4"/>
  <rect x="925" y="202" width="22" height="15" rx="2" fill="none" stroke="#4F7E91" stroke-width="2.2"/>
  <path d="M931 222h10M936 217v5" stroke="#4F7E91" stroke-width="2.2" stroke-linecap="round"/>
  <text x="966" y="211" class="label">TS Web</text>
  <text x="966" y="235" class="body">Map · claims · proofs</text>
  <rect x="1029" y="246" width="98" height="21" rx="10.5" fill="#E8F4F3"/>
  <text x="1078" y="261" class="note" text-anchor="middle" fill="#20766F">READ ONLY</text>

  <g filter="url(#shadow)">
    <rect x="900" y="300" width="250" height="100" rx="18" fill="#FFFFFF" stroke="#4F7E91" stroke-width="1.8"/>
  </g>
  <circle cx="936" cy="340" r="19" fill="#E2F1F4"/>
  <rect x="928" y="327" width="16" height="26" rx="3" fill="none" stroke="#4F7E91" stroke-width="2.2"/>
  <circle cx="936" cy="349" r="1.7" fill="#4F7E91"/>
  <text x="966" y="338" class="label">Phone / terminal</text>
  <text x="966" y="362" class="body">Session-scoped clients</text>
  <rect x="1029" y="370" width="98" height="21" rx="10.5" fill="#E8F4F3"/>
  <text x="1078" y="385" class="note" text-anchor="middle" fill="#20766F">READ ONLY</text>

  <!-- Kernel projections. -->
  <path d="M830 210H900" class="tealFlow"/>
  <path d="M830 345H900" class="tealFlow"/>

  <text x="48" y="495" class="section">CAPABILITY + EVIDENCE PLANE</text>

  <!-- Bounded capabilities -->
  <g filter="url(#shadow)">
    <rect x="48" y="515" width="310" height="130" rx="18" fill="#FFFDF8" stroke="#D7AC45" stroke-width="1.8"/>
  </g>
  <text x="70" y="548" class="label">Bounded capabilities</text>
  <text x="70" y="570" class="body">typed action adapters</text>
  <g class="note" text-anchor="middle">
    <circle cx="79" cy="606" r="18" fill="#F7E9BC"/><text x="79" y="611">G16</text>
    <circle cx="128" cy="606" r="18" fill="#F7E9BC"/><text x="128" y="611">xTB</text>
    <circle cx="177" cy="606" r="18" fill="#F7E9BC"/><text x="177" y="611">C</text>
    <circle cx="226" cy="606" r="18" fill="#F7E9BC"/><text x="226" y="611">ASE</text>
    <circle cx="275" cy="606" r="18" fill="#F7E9BC"/><text x="275" y="611">SSH</text>
    <circle cx="324" cy="606" r="18" fill="#F7E9BC"/><text x="324" y="611">R</text>
  </g>

  <!-- Evidence path -->
  <g filter="url(#shadow)">
    <rect x="415" y="515" width="325" height="130" rx="18" fill="#F8FAFD" stroke="#6C8FB3" stroke-width="1.8"/>
  </g>
  <text x="437" y="548" class="label">Evidence path</text>
  <text x="437" y="570" class="body">Artifact → Candidate → Observation → Proof</text>
  <path d="M454 606C489 584 523 584 558 606S627 628 662 606S697 584 716 600" fill="none" stroke="#6C8FB3" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrowNavy)"/>
  <circle cx="454" cy="606" r="8" fill="#FFFFFF" stroke="#6C8FB3" stroke-width="2.3"/>
  <circle cx="558" cy="606" r="8" fill="#FFFFFF" stroke="#6C8FB3" stroke-width="2.3"/>
  <circle cx="662" cy="606" r="8" fill="#FFFFFF" stroke="#6C8FB3" stroke-width="2.3"/>
  <circle cx="716" cy="600" r="8" fill="#DDEAF4" stroke="#6C8FB3" stroke-width="2.3"/>

  <!-- Scientific outcome -->
  <g filter="url(#shadow)">
    <rect x="800" y="515" width="350" height="130" rx="18" fill="url(#outcomeGradient)" stroke="#D6654D" stroke-width="1.8"/>
  </g>
  <text x="822" y="548" class="label">Scientific outcome</text>
  <text x="822" y="570" class="body">supported · open · blocked · stale</text>
  <path d="M835 611h54l18-27 24 48 24-37 22 16 28-29 29 29h79" fill="none" stroke="#D6654D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="835" cy="611" r="5.5" fill="#D6654D"/>
  <circle cx="1113" cy="611" r="5.5" fill="#D6654D"/>

  <!-- Hypothesis-to-proof data loop. -->
  <path d="M410 445C410 477 236 473 205 515" class="navyFlow"/>
  <text x="331" y="466" class="note" text-anchor="middle">typed action</text>
  <path d="M358 584H415" class="navyFlow"/>
  <text x="386" y="568" class="note" text-anchor="middle">artifacts</text>
  <path d="M578 515C578 483 596 477 596 445" class="tealFlow"/>
  <text x="622" y="476" class="note">promote</text>
  <path d="M756 445C764 480 902 478 931 515" class="tealFlow"/>
  <text x="845" y="476" class="note" text-anchor="middle">validated state</text>

  <!-- Legend -->
  <g transform="translate(48 672)">
    <line x1="0" y1="0" x2="31" y2="0" stroke="#365B70" stroke-width="2.8" marker-end="url(#arrowNavy)"/>
    <text x="44" y="5" class="note">actions / artifacts</text>
    <line x1="183" y1="0" x2="214" y2="0" stroke="#208C86" stroke-width="2.8" marker-end="url(#arrowTeal)"/>
    <text x="227" y="5" class="note">evidence / projection</text>
    <line x1="408" y1="0" x2="439" y2="0" stroke="#D6654D" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arrowCoral)"/>
    <text x="452" y="5" class="note">decision feedback</text>
  </g>
  <text x="1150" y="677" class="note" text-anchor="end">TSPi · abstract architecture · 2026</text>
</svg>
