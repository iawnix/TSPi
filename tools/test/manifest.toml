[suites.package]
kind = "package-check"
environment = "Node.js 22"
description = "Package inventory and release-boundary checks."
paths = []

[suites.remote-smoke]
kind = "scenario"
environment = "managed Python + configured Job Runtime platform"
description = "Opt-in remote Job Runtime smoke; never part of the default suite."
paths = []

[suites.live-eval]
kind = "scenario"
environment = "managed Python + authorized model provider"
description = "Opt-in model evaluation; never part of CI or the default suite."
paths = ["tests/scenarios/t003_live_eval.mjs"]

[suites.live-recovery]
kind = "scenario"
environment = "managed Python + authorized model provider"
description = "Opt-in real model recovery from an injected evidence ID error through current Native tools."
paths = ["tests/scenarios/t003_live_recovery.mjs"]
