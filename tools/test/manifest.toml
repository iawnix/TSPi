schema_version = "tspi-test-manifest/1"

[suites.fast]
kind = "pytest-source"
environment = "conda:tspi-skill"
description = "Deterministic unit and public contract tests against the source tree."
paths = ["tests/unit", "tests/contract"]

[suites.source]
kind = "pytest-managed"
environment = "wheel-overlay"
description = "All Python tests against a temporary wheel-backed runtime."
paths = ["tests"]

[suites.native-pi]
kind = "node-native"
environment = "Node.js 22 + pinned Pi checkout (TSPI_TEST_PI_RUNTIME_ROOT)"
description = "Pi Harness server, native TUI client, recovery, Monitor, and Native session checks."
paths = [
  "tests/node/native/pi-app-server.test.mjs",
  "tests/node/native/pi-session-worker-startup.test.mjs",
  "tests/node/native/worker-research-flow.test.mjs",
  "tests/node/native/decision-context.test.mjs",
  "tests/node/native/compaction-outcome.test.mjs",
  "tests/node/fast/job-query-recovery.test.mjs",
  "tests/node/native/monitor-admission.test.mjs",
  "tests/node/native/pi-harness-policy.test.mjs",
  "tests/node/native/pi-session-control.test.mjs",
  "tests/node/native/tspi-host.test.mjs",
  "tests/node/native/tspi-host-transport.test.mjs",
  "tests/node/fast/pi-monitor-worker.test.mjs",
  "tests/node/fast/tspi-terminal-errors.test.mjs",
  "tests/node/fast/tspi-terminal-client.test.mjs",
  "tests/node/native/tspi-native-commands.test.mjs",
  "tests/node/native/tspi-link-relay.test.mjs",
  "tests/node/native/server-extension-loader.test.mjs",
  "tests/node/native/research-interpretation-contract.test.mjs",
  "tests/node/native/tool-presentation.test.mjs",
  "tests/node/native/status-presentation.test.mjs",
  "tests/node/native/provider-turn.test.mjs",
  "tests/node/manifest-workspace-boundaries.test.mjs",
  "tests/node/research-agent-app-e2e.test.mjs",
  "tests/node/research-agent-boundary.test.mjs",
  "tests/node/research-agent-composition.test.mjs",
  "tests/node/research-agent-compute-cross-mode.test.mjs",
  "tests/node/research-agent-framework.test.mjs",
  "tests/node/research-agent-kernel-bridge.test.mjs",
  "tests/node/research-agent-kernel-factory.test.mjs",
  "tests/node/research-agent-kernel-python.test.mjs",
  "tests/node/research-agent-lifecycle-authority.test.mjs",
  "tests/node/research-agent-memory-context.test.mjs",
  "tests/node/research-agent-native-kernel-route.test.mjs",
  "tests/node/research-agent-options-contract.test.mjs",
  "tests/node/research-agent-pi-runtime-module.test.mjs",
  "tests/node/research-agent-session-store.test.mjs",
  "tests/node/research-agent-tool-admission.test.mjs",
  "tests/node/research-agent-turn-router.test.mjs",
  "tests/node/research-agent-workspace-catalog.test.mjs",
  "tests/node/research-agent-workspace.test.mjs",
  "tests/node/research-map-reader.test.mjs",
  "tests/node/fast/lifecycle-recovery.test.mjs",
  "tests/node/native/checkpoint-followup.test.mjs",
  "tests/node/native/extension-manifest-loader.test.mjs",
  "tests/node/native/prepared-job.test.mjs",
  "tests/node/native/state-continuation.test.mjs",
  "tests/node/native/tspi-harness-backend.test.mjs",
  "tests/node/native/workspace-mode-tools.test.mjs",
