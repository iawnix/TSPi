schema_version = "tspi-test-manifest/1"

[suites.fast]
kind = "pytest-source"
environment = "conda:tspi-skill"
description = "Deterministic unit and public contract tests against the source tree."
paths = ["tests/unit", "tests/contract"]

[suites.source]
kind = "pytest-managed"
environment = "wheel-overlay"
description = "All Python tests against a temporary wheel-backed runtime."
paths = ["tests"]

[suites.native-pi]
kind = "node-native"
environment = "Node.js 22 + pinned Pi checkout (TSPI_TEST_PI_RUNTIME_ROOT)"
description = "Pi Harness server, native TUI client, recovery, Monitor, and Native session checks."
paths = [
  "tests/node/native/pi-app-server.test.mjs",
  "tests/node/native/pi-session-worker-startup.test.mjs",
  "tests/node/native/worker-research-flow.test.mjs",
  "tests/node/native/monitor-admission.test.mjs",
  "tests/node/native/pi-harness-policy.test.mjs",
  "tests/node/native/pi-session-control.test.mjs",
  "tests/node/native/tspi-host.test.mjs",
  "tests/node/native/tspi-host-transport.test.mjs",
  "tests/node/fast/pi-monitor-worker.test.mjs",
  "tests/node/fast/tspi-terminal-errors.test.mjs",
  "tests/node/fast/tspi-terminal-client.test.mjs",
  "tests/node/native/tspi-native-commands.test.mjs",
  "tests/node/native/tspi-link-relay.test.mjs",
  "tests/node/native/server-extension-loader.test.mjs",
  "tests/node/native/research-interpretation-contract.test.mjs",
  "tests/node/native/tool-presentation.test.mjs",
  "tests/node/native/status-presentation.test.mjs",
  "tests/node/native/provider-turn.test.mjs",
]

[suites.package]
kind = "package-check"
environment = "Node.js 22"
description = "Package inventory and release-boundary checks."
paths = []

[suites.remote-smoke]
kind = "scenario"
environment = "managed Python + configured Job Runtime platform"
description = "Opt-in remote Job Runtime smoke; never part of the default suite."
paths = []

[suites.live-eval]
kind = "scenario"
environment = "managed Python + authorized model provider"
description = "Opt-in model evaluation; never part of CI or the default suite."
paths = []
