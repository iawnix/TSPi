schema_version = "research-agent-test-manifest/1"

[suites.static]
kind = "static"
environment = "managed Node dependencies"
description = "Generated contracts, TypeScript, architecture and package boundaries."
requires = ["python", "node"]
timeout = 240

[suites.fast]
exclude = ["tests/unit/test_local_job_isolation.py", "tests/contract/test_system_service_cleanup.py"]
kind = "pytest"
environment = "locked Python source runtime"
description = "Deterministic unit and public contract tests."
globs = ["tests/unit/test_*.py", "tests/contract/test_*.py", "backend/tests/test_*.py"]
requires = ["python", "node"]
timeout = 900

[suites.integration]
kind = "pytest"
environment = "locked Python source runtime"
description = "Research, jobs, artifact and application integration."
globs = ["tests/integration/test_*.py"]
requires = ["python", "node", "pi"]
timeout = 1200

[suites.node-fast]
kind = "node"
environment = "managed Node dependencies"
description = "Node pure logic and contracts without a Pi server."
globs = ["tests/node/*.test.mjs", "tests/node/fast/*.test.mjs"]
requires = ["node", "python"]
timeout = 300

[suites.native-pi]
kind = "node-native"
environment = "pinned Pi source and locked Python"
description = "Real Pi workers, native client, tools, recovery and Monitor."
globs = ["tests/node/native/*.test.mjs"]
requires = ["node", "python", "pi"]
timeout = 1800

[suites.package]
kind = "package-check"
environment = "managed Node dependencies"
description = "Package inventory and release boundaries."
requires = ["node", "python"]
timeout = 300

[suites.source]
exclude = ["tests/unit/test_local_job_isolation.py", "tests/contract/test_system_service_cleanup.py"]
kind = "pytest-managed"
environment = "wheel overlay built from this snapshot"
description = "All Python tests against the built wheel."
globs = ["tests/unit/test_*.py", "tests/contract/test_*.py", "tests/integration/test_*.py", "backend/tests/test_*.py"]
aggregate = true
requires = ["node", "python", "pi"]
timeout = 2400

[suites.live-eval]
kind = "scenario"
environment = "authorized external provider"
description = "External model evaluation requires explicit data authorization."
paths = ["tests/scenarios/t003_live_eval.mjs"]
external = true

[suites.live-recovery]
kind = "scenario"
environment = "authorized external provider"
description = "External model recovery requires explicit data authorization."
paths = ["tests/scenarios/t003_live_recovery.mjs"]
external = true

[suites.remote-smoke]
kind = "unavailable"
environment = "authorized remote platform"
description = "No executable remote smoke scenario implemented."
external = true

[suites.release]
kind = "release"
environment = "immutable complete package archive"
description = "Actual package installation, external cwd, wheel origins and uninstall."
requires = ["python", "host", "node", "pi"]
timeout = 2400
aggregate = true

[suites.system-services]
kind = "systemd"
environment = "real local user manager, isolated registered units"
description = "Real service resource limits and jobs surviving Host stop."
globs = ["tests/unit/test_local_job_isolation.py", "tests/contract/test_system_service_cleanup.py"]
requires = ["python", "node"]
timeout = 300

[suites.phone]
kind = "flutter"
environment = "private Flutter SDK and offline pub cache"
description = "Phone contracts and real local Host interop from both source snapshots."
requires = ["python", "node", "pi"]
timeout = 900
aggregate = true
