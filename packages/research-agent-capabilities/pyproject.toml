[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-capabilities"
version = "0.1.0"
description = "Framework-neutral capability, environment, and artifact contracts"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["research_agent_capabilities*"]

[tool.setuptools.data-files]
"research-agent-capabilities/schemas" = ["schemas/*.json"]
