[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tspi-runtime"
dynamic = ["version"]
description = "Deterministic Python kernel for the TS Agent Pi package"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "ase",
  "jsonschema",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pillow>=10,<13",
  "rdkit>=2025.9,<2027",
  "scipy",
  "xyzrender>=0.2.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {tspi_runtime = "packages/tspi-runtime/tspi_runtime", research_state = "packages/research-state/research_state", research_memory = "packages/research-memory/research_memory", research_compute = "packages/research-compute/research_compute"}
packages = ["tspi_runtime", "tspi_runtime.backends", "tspi_runtime.remote", "tspi_runtime.runtime", "tspi_runtime.structures", "tspi_runtime.workspace", "tspi_runtime.providers", "tspi_runtime.reaction", "tspi_runtime.analysis", "tspi_runtime.platforms", "tspi_runtime.pyscf", "research_state", "research_memory", "research_compute"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "tspi_runtime._version.__version__"}

[tool.setuptools.package-data]
"tspi_runtime" = ["command_catalog.json"]
"research_compute" = ["contracts/*.json"]
"tspi_runtime.remote" = ["*.toml"]
"tspi_runtime.workspace" = ["contracts/*.json"]

[tool.pytest.ini_options]
pythonpath = ["packages/tspi-runtime", "packages/research-state", "packages/research-memory", "packages/research-compute", "extensions/tspi-render/providers", "extensions/tspi-report/providers", "extensions/tspi-notify/providers", "."]
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
