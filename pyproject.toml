[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tspi-runtime"
dynamic = ["version"]
description = "Deterministic Python kernel for the TS Agent Pi package"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "ase",
  "jsonschema",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pillow>=10,<13",
  "rdkit>=2025.9,<2027",
  "scipy",
  "xyzrender>=0.2.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {tspi_runtime = "packages/tspi-runtime/tspi_runtime", tspi_foundation = "packages/tspi-foundation/tspi_foundation", tspi_bootstrap = "packages/tspi-bootstrap/tspi_bootstrap", research_state = "packages/research-state/research_state", research_memory = "packages/research-memory/research_memory", artifact_store = "packages/artifact-store/artifact_store", job_runtime = "packages/job-runtime/job_runtime"}
packages = [
  "tspi_runtime",
  "tspi_foundation", "tspi_bootstrap", "research_state", "research_memory", "artifact_store", "job_runtime",
  "research_state.contracts",
]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "tspi_runtime._version.__version__"}

[tool.setuptools.package-data]
"tspi_runtime" = ["command_catalog.json"]
"research_state" = ["contracts/*.json"]

[tool.pytest.ini_options]
pythonpath = ["packages/tspi-runtime", "packages/tspi-foundation", "packages/tspi-bootstrap", "packages/research-state", "packages/research-memory", "packages/artifact-store", "packages/job-runtime", "extensions/email/scripts", "."]
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
