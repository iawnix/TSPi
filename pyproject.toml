[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-agent-kernel"
dynamic = ["version"]
description = "Deterministic Python kernel for the TS Agent Pi package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ase",
  "jsonschema",
  "numpy>=2.0,<3",
  "pillow>=10,<13",
  "rdkit>=2025.9,<2027",
  "scipy",
]

[project.optional-dependencies]
render = ["xyzrender>=0.2.1"]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "ts_agent._version.__version__"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["ts_agent*"]

[tool.setuptools.package-data]
"ts_agent.compute" = ["contracts/*.json"]
"ts_agent.remote" = ["*.toml"]
"ts_agent.validation" = [
  "acceptance_profiles/*.json",
  "templates/builtin/*.json",
]
"ts_agent.web" = [
  "static/*.css",
  "static/*.html",
  "static/*.js",
  "static/*.svg",
]
"ts_agent.workspace" = ["contracts/*.json"]

[tool.pytest.ini_options]
pythonpath = ["python", "."]
testpaths = ["tests"]
