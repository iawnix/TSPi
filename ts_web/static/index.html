</div>

<div class="toast-wrap" id="toasts"></div>

<script>
/* ============================================================
   State + constants
   ============================================================ */
const TABS = [
  ["summary",      "Summary"],
  ["rationale",    "Rationale"],
  ["decisions",    "Timeline"],
  ["evidence",     "Evidence"],
  ["reflection",   "Reflection"],
  ["files",        "Files"],
  ["json",         "JSON"]
];

/* State labels/colors come from graph.presentation, the single source of
   truth emitted by the normalizer. The UI keeps no vocabulary of its own. */
function presentation(group, value) {
  return state.graph?.presentation?.[group]?.[value] || null;
}
function presLabel(group, value, fallback) {
  return presentation(group, value)?.label ?? (fallback !== undefined ? fallback : (value || "—"));
}
function presColor(group, value) {
  return presentation(group, value)?.color || "grey";
}
const COLOR_VAR = {
  grey: "var(--grey)", cyan: "var(--cyan)", accent: "var(--accent)",
  purple: "var(--purple)", green: "var(--green)", red: "var(--red)",
  amber: "var(--amber)", blue: "var(--accent)"
};

const NODE_W = 240, NODE_H = 84;
const X_GAP = 72, Y_GAP = 26;

/* Stage → label + icon. Patterns are matched case-insensitively against node.stage. */
const STAGE_INFO_LIST = [
  { match: /preflight|atom_map|endpoint_opt/i,         label: "Preflight",         icon: "preflight" },
  { match: /gaussian.*neb|neb.*gaussian|external.*gaussian.*neb/i,
                                                          label: "Gaussian NEB",    icon: "candidate_generation" },
  { match: /gaussian|tsfreq|ts\/freq/i,                label: "Gaussian TS/Freq",  icon: "gaussian_tsfreq_validation" },
  { match: /qbics|dmecp|mecp/i,                        label: "QBICS dMECP",       icon: "qbics_dmecp" },
  { match: /connectivity|endpoint_check|displacement/i,label: "Connectivity",      icon: "connectivity_check" },
  { match: /\birc\b/i,                                 label: "IRC",               icon: "irc" },
  { match: /reflect/i,                                 label: "Reflection",        icon: "mechanism_reflection" },
  { match: /report|final|accepted/i,                   label: "Report",            icon: "report" },
  { match: /candidate|neb|scan|qst|dimer|xtb/i,        label: "Candidate Gen",     icon: "candidate_generation" }
];
const STAGE_ICON_PATHS = {
  preflight:                  '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>',
  candidate_generation:       '<path d="M12 2.5l2.7 6.7 7.3 0.6-5.5 4.8 1.7 7.1L12 17.9 5.8 21.7l1.7-7.1L2 9.8l7.3-0.6z"/>',
  gaussian_tsfreq_validation: '<path d="M2 12 Q 6 4, 10 12 T 18 12 L 22 12"/>',
  qbics_dmecp:                '<circle cx="12" cy="4.5" r="1.8"/><circle cx="4.5" cy="14" r="1.8"/><circle cx="19.5" cy="14" r="1.8"/><circle cx="12" cy="20" r="1.8"/><line x1="11" y1="6" x2="5.5" y2="12.5"/><line x1="13" y1="6" x2="18.5" y2="12.5"/><line x1="6" y1="15.5" x2="11" y2="18.5"/><line x1="18" y1="15.5" x2="13" y2="18.5"/>',
  connectivity_check:         '<path d="M9.5 12a4 4 0 0 1 4-4h3a4 4 0 0 1 0 8h-1.5"/><path d="M14.5 12a4 4 0 0 1-4 4h-3a4 4 0 0 1 0-8H9"/>',
  irc:                        '<polyline points="17 4 21 8 17 12"/><path d="M3 13V9a4 4 0 0 1 4-4h14"/><polyline points="7 20 3 16 7 12"/><path d="M21 11v4a4 4 0 0 1-4 4H3"/>',
  mechanism_reflection:       '<path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.4 8.4 0 0 1 8.5-8.5 8.4 8.4 0 0 1 8.5 8.5z"/>',
  report:                     '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="14 3 14 9 20 9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/>'
};
function stageInfo(stage) {
  if (!stage) return { label: "—", icon: null };
  for (const e of STAGE_INFO_LIST) if (e.match.test(stage)) return e;
  return { label: stage.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase()), icon: null };
}

const state = {
  workspaces: [],
  workspaceId: "",
  job: null,
  graph: null,
  selected: null,
  nodePayload: null,
  tab: "summary",
  zoom: 1,
  pan: { x: 40, y: 40 },
  layout: { positions: {}, width: 0, height: 0 },
  drag: null
};

/* ============================================================
   Theme handling
   ============================================================ */
function applyTheme() {
  const stored = localStorage.getItem("ts-theme");
  if (stored === "light" || stored === "dark") {
    document.documentElement.dataset.theme = stored;
  } else {
    document.documentElement.dataset.theme = "auto";
  }
  updateThemeIcon();
}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme;
  const isDark = cur === "dark" || (cur === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  const next = isDark ? "light" : "dark";
  localStorage.setItem("ts-theme", next);
  document.documentElement.dataset.theme = next;
  updateThemeIcon();
  renderGraph();
}
function updateThemeIcon() {
  const cur = document.documentElement.dataset.theme;
  const isDark = cur === "dark" || (cur === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.getElementById("themeIcon").innerHTML = isDark
    ? `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>`
    : `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeIcon);

/* ============================================================
   API
   ============================================================ */
async function api(url) {
  const res = await fetch(url, { cache: "no-store" });
  let payload = null;
  const text = await res.text();
  try { payload = JSON.parse(text); } catch {}
  if (!res.ok) throw new Error(payload?.error?.message || text.slice(0, 200) || res.statusText);
  return payload;
}

function workspaceApi(path) {
  if (!state.workspaceId) return path;
  return `/api/workspace/${encodeURIComponent(state.workspaceId)}${path}`;
}

function workspaceIdFromUrl() {
  try {
    return new URL(location.href).searchParams.get("workspace") || "";
  } catch {
    return "";
  }
}

function workspaceExists(id) {
  return !!id && state.workspaces.some(ws => ws.id === id);
}

function chooseWorkspaceId(payload) {
  const urlId = workspaceIdFromUrl();
  const storedId = localStorage.getItem("ts-workspace-id") || "";
  const apiDefault = payload.default_workspace || "";
  if (workspaceExists(state.workspaceId)) return state.workspaceId;
  if (workspaceExists(urlId)) return urlId;
  if (workspaceExists(storedId)) return storedId;
  if (workspaceExists(apiDefault)) return apiDefault;
  if (state.workspaces.length === 1) return state.workspaces[0].id;
  return "";
}

function persistWorkspaceSelection(id) {
  if (!id) return;
  localStorage.setItem("ts-workspace-id", id);
  const url = new URL(location.href);
  url.searchParams.set("workspace", id);
  history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);
}

/* ============================================================
   Load + render entry
   ============================================================ */
async function loadAll() {
  try {
    const payload = await api("/api/workspaces");
    state.workspaces = payload.workspaces || [];
    state.workspaceId = chooseWorkspaceId(payload);
    if (state.workspaceId) persistWorkspaceSelection(state.workspaceId);
    renderWorkspaceChip();
    renderWorkspacePop();
    renderWorkspacePanel();
    if (!state.workspaceId) {
      renderNoWorkspace();
      return;
    }
    await loadWorkspaceData();
  } catch (err) {
    document.getElementById("detail").innerHTML = `<p class="error">${escapeHtml(String(err))}</p>`;
  }
}

async function switchWorkspace(id) {
  if (!workspaceExists(id)) return;
  state.workspaceId = id;
  state.selected = null;
  state.nodePayload = null;
  state.tab = "summary";
  state.zoom = 1; state.pan = { x: 40, y: 40 };
  persistWorkspaceSelection(id);
  renderWorkspaceChip();
  renderWorkspacePop();
  renderWorkspacePanel();
  await loadWorkspaceData();
}

async function loadWorkspaceData() {
  const refresh = document.getElementById("refreshBtn");
  refresh.innerHTML = `<span class="spinner"></span>`;
  try {
    if (!state.workspaceId && state.workspaces.length !== 1) {
      renderNoWorkspace();
      return;
    }
    if (!state.workspaceId && state.workspaces.length === 1) {
      state.workspaceId = state.workspaces[0].id;
      persistWorkspaceSelection(state.workspaceId);
      renderWorkspaceChip();
      renderWorkspacePop();
      renderWorkspacePanel();
    }
    const path = workspaceApi("/job");
    state.job = await api(path);
    state.graph = state.job.graph;
    renderSidebars();
    layoutGraph();
    renderGraph();
    fitGraph();
    const exists = state.selected && state.graph.nodes.some(n => n.id === state.selected);
    if (exists) await selectNode(state.selected);
    else if (state.graph.nodes.length) await selectNode(state.graph.nodes[0].id);
    else renderEmptyNode();
  } catch (err) {
    document.getElementById("detail").innerHTML = `<p class="error">${escapeHtml(String(err))}</p>`;
  } finally {
    refresh.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>`;
  }
}

/* ============================================================
   Workspace UI
   ============================================================ */
/* Workspace claim_state label/color come from graph.presentation.workspace_state,
   the same single source as node_state. The backend's explorer_workspace_summary
   is the only place that decides which key applies; do not re-derive here. */
function pathwayStatusForWorkspace(ws) {
  const key = ws?.claim_state || "searching";
  return { label: presLabel("workspace_state", key, key), color: presColor("workspace_state", key) };
}

function renderWorkspaceChip() {
  const ws = state.workspaces.find(w => w.id === state.workspaceId);
  if (!ws) {
    document.getElementById("wsChipLabel").textContent = state.workspaces.length ? "select workspace" : "no workspace";
    document.getElementById("wsChipMeta").textContent = state.workspaces.length ? `${state.workspaces.length} registered` : "";
    return;
  }
  document.getElementById("wsChipLabel").textContent = ws.name || ws.id;
  const bits = [];
  if (ws.system) bits.push(ws.system);
  if (ws.charge !== undefined && ws.charge !== "") bits.push(`q=${ws.charge}`);
  if (ws.multiplicity) bits.push(`m=${ws.multiplicity}`);
  document.getElementById("wsChipMeta").textContent = bits.join(" · ");
}
function renderWorkspacePop() {
  const pop = document.getElementById("wsPop");
  pop.innerHTML = state.workspaces.map(ws => {
    const bits = [ws.source].filter(Boolean);
    const wsState = pathwayStatusForWorkspace(ws);
    return `<div class="ws-item" role="option" data-id="${escapeHtml(ws.id)}" aria-selected="${ws.id === state.workspaceId}">
      <div class="ws-item-name">${escapeHtml(ws.name || ws.id)}</div>
      <div><span class="chip size-sm" data-color="${wsState.color}">${escapeHtml(wsState.label)}</span></div>
      <div class="ws-item-meta">${escapeHtml(shortPath(bits[0] || ""))}</div>
    </div>`;
  }).join("");
  pop.querySelectorAll(".ws-item").forEach(el => {
    el.addEventListener("click", () => {
      closeWsPop();
      switchWorkspace(el.dataset.id);
    });
  });
}

function renderWorkspacePanel() {
  const section = document.getElementById("workspacesSection");
  const list = document.getElementById("workspaceList");
  const count = document.getElementById("workspacesCount");
  if (!list || !count) return;
  // The topbar workspace chip is the canonical switcher. Duplicating the same
  // control inside the task sidebar adds noise and stale highlight states.
  if (section) section.hidden = true;
  count.textContent = String(state.workspaces.length);
  if (!state.workspaces.length) {
    list.innerHTML = `<div class="muted">No workspaces configured.</div>`;
    return;
  }
  list.innerHTML = state.workspaces.map(ws => {
    const bits = [];
    if (ws.system) bits.push(ws.system);
    if (ws.charge !== undefined && ws.charge !== "") bits.push(`q=${ws.charge}`);
    if (ws.multiplicity) bits.push(`m=${ws.multiplicity}`);
    const wsState = pathwayStatusForWorkspace(ws);
    return `<button class="workspace-card" type="button" data-id="${escapeHtml(ws.id)}" aria-current="${ws.id === state.workspaceId}">
      <span class="workspace-card-name">${escapeHtml(ws.name || ws.id)}</span>
      <span class="chip size-sm" data-color="${wsState.color}">${escapeHtml(wsState.label)}</span>
      <span class="workspace-card-meta">${escapeHtml(bits.join(" · ") || shortPath(ws.source || ""))}</span>
    </button>`;
  }).join("");
  list.querySelectorAll(".workspace-card").forEach(el => {
    el.addEventListener("click", () => {
      if (el.dataset.id && el.dataset.id !== state.workspaceId) switchWorkspace(el.dataset.id);
    });
  });
}
function toggleWsPop() {
  const pop = document.getElementById("wsPop");
  const chip = document.getElementById("wsChip");
  const open = pop.classList.toggle("open");
  chip.setAttribute("aria-expanded", String(open));
}
function closeWsPop() {
  document.getElementById("wsPop").classList.remove("open");
  document.getElementById("wsChip").setAttribute("aria-expanded", "false");
}

/* ============================================================
   Left panel
   ============================================================ */
function renderSidebars() {
  const manifest = state.job.manifest || {};
  const mechanism = state.job.mechanism || {};
  const graph = state.job.graph || {};
  const workspace = state.job.workspace || {};
  const acceptedTs = workspace.accepted_ts || graph.accepted_ts || "";
  const claimState = workspace.claim_state || "searching";

  renderWorkspaceChip();
  renderWorkspacePanel();

  const frontierNodes = Array.isArray(graph.frontier_nodes) ? graph.frontier_nodes.join(", ") : "";
  renderKv("jobKv", {
    system:       workspace.system || manifest.system,
    charge:       workspace.charge ?? manifest.charge,
    multiplicity: workspace.multiplicity ?? manifest.multiplicity,
    // Send the raw claim_state key so formatV can render it via the
    // server-supplied workspace_state presentation (one source of truth).
    claim_state:  claimState,
    accepted_ts:  acceptedTs,
    frontier:     frontierNodes
  });
  renderKv("mechKv", {
    class:      mechanism.reaction_class,
    confidence: mechanism.reaction_class_confidence,
    atoms:      Array.isArray(mechanism.key_atoms) ? mechanism.key_atoms.join(", ") : mechanism.key_atoms,
    evidence:   state.job.evidence_summary?.count ?? 0
  });
  renderList("facts", mechanism.validated_facts || [], "factsCount");
  renderList("refuted", mechanism.refuted_hypotheses || [], "refutedCount");
  renderList("questions", mechanism.open_questions || [], "questionsCount");
  renderList("mechanismAnalysis", mechanism.latest_analysis || [], "analysisCount");
}

function renderKv(id, obj) {
  document.getElementById(id).innerHTML = Object.entries(obj).filter(([k, v]) => k === "claim_state" || hasDisplayValue(v)).map(([k, v]) =>
    `<div class="k">${escapeHtml(k)}</div><div class="v">${formatV(k, v)}</div>`
  ).join("");
}
function hasDisplayValue(v) {
  if (v === null || v === undefined) return false;
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === "string") {
    const trimmed = v.trim();
    return trimmed !== "" && trimmed !== "—";
  }
  return true;
}
function formatV(k, v) {
  if (v === null || v === undefined || v === "") return `<span class="muted">—</span>`;
  if (k === "claim_state") {
    const label = presLabel("workspace_state", v, v);
    const color = presColor("workspace_state", v);
    return `<span class="chip" data-color="${color}">${escapeHtml(label)}</span>`;
  }
  if (k === "evidence") return `<span class="v mono">${escapeHtml(String(v))}</span>`;
  return escapeHtml(typeof v === "object" ? JSON.stringify(v) : String(v));
}
function renderList(id, values, countId) {
  const el = document.getElementById(id);
  const arr = Array.isArray(values) ? values : [];
  if (countId) document.getElementById(countId).textContent = String(arr.length);
  el.innerHTML = arr.length
    ? arr.map(v => `<li>${escapeHtml(typeof v === "object" ? JSON.stringify(v) : String(v))}</li>`).join("")
    : `<li class="muted">None.</li>`;
}
/* ============================================================
   Graph layout
   ============================================================ */
function layoutGraph() {
  const graph = state.graph || { nodes: [], edges: [] };
  const byId = Object.fromEntries(graph.nodes.map(n => [n.id, n]));
  const kids = {}, indeg = {};
  for (const n of graph.nodes) { kids[n.id] = []; indeg[n.id] = 0; }
  for (const e of graph.edges) {
    if (e.kind !== "branch") continue;
    if (!byId[e.source] || !byId[e.target]) continue;
    kids[e.source].push(e.target);
    indeg[e.target] = (indeg[e.target] || 0) + 1;
  }
  const roots = graph.nodes.map(n => n.id).filter(id => !indeg[id]).sort();
  const levels = {};
  const seen = new Set();
  const stack = [];
  for (const r of (roots.length ? roots : graph.nodes.map(n => n.id).sort())) stack.push([r, 0]);
  while (stack.length) {
    const [id, depth] = stack.pop();
    if (seen.has(id)) continue;
    seen.add(id);
    levels[id] = Math.max(levels[id] ?? 0, depth);
    for (const c of (kids[id] || []).slice().sort()) stack.push([c, depth + 1]);
  }
  for (const n of graph.nodes) if (levels[n.id] === undefined) levels[n.id] = 0;

  const grouped = {};
  for (const n of graph.nodes) {
    const lv = levels[n.id];
    (grouped[lv] = grouped[lv] || []).push(n.id);
  }
  const positions = {};
  let maxX = 0, maxY = 0;
  for (const lv of Object.keys(grouped).map(Number).sort((a, b) => a - b)) {
    grouped[lv].sort();
    grouped[lv].forEach((id, i) => {
      const x = 40 + lv * (NODE_W + X_GAP);
      const y = 40 + i * (NODE_H + Y_GAP);
      positions[id] = { x, y };
      maxX = Math.max(maxX, x + NODE_W);
      maxY = Math.max(maxY, y + NODE_H);
    });
  }
  state.layout = { positions, width: maxX + 40, height: maxY + 40 };
}

function nodeColor(n) {
  // `card_color` is the compact server-derived token for node-card display.
  return COLOR_VAR[n?.card_color || n?.color] || "var(--grey)";
}
/* ============================================================
   Graph rendering (SVG)
   ============================================================ */
function renderLegend() {
  const legend = document.getElementById("graphLegend");
  if (!legend) return;
  const vocab = state.graph?.presentation?.card_status || {};
  const eventRoles = state.graph?.presentation?.event_role || {};
  const branchSource = eventRoles.branch_source || {};
  const keys = ["success", "error", "running", "ready", "stopped", "unknown"];
  const statusChips = keys
    .filter(key => vocab[key])
    .map(key => `<span class="chip" data-color="${escapeHtml(vocab[key].color || "grey")}">${escapeHtml(vocab[key].label || key)}</span>`)
  const branchLegend = `<span class="chip no-dot symbol-legend" data-color="${escapeHtml(branchSource.color || "purple")}" title="Branch marker on a node">
      <span class="legend-glyph" aria-hidden="true">↺</span>${escapeHtml(branchSource.label || "branched from")}
    </span>`;
  legend.innerHTML = [...statusChips, branchLegend].join("");
}

function renderGraph() {
  renderLegend();
  const svg = document.getElementById("graphSvg");
  const vp  = document.getElementById("viewport");
  vp.innerHTML = "";
  vp.setAttribute("transform", `translate(${state.pan.x},${state.pan.y}) scale(${state.zoom})`);

  const graph = state.graph || { nodes: [], edges: [] };
  const positions = state.layout.positions;
  const lineage = computeLineage(graph, state.selected);

  // Edges
  const edgeLayer = makeSvg("g");
  vp.appendChild(edgeLayer);
  for (const e of graph.edges) {
    const s = positions[e.source];
    const t = positions[e.target];
    if (!s || !t) continue;
    edgeLayer.appendChild(buildEdge(e, s, t, lineage));
  }

  // Nodes
  const nodeLayer = makeSvg("g");
  vp.appendChild(nodeLayer);
  for (const n of graph.nodes) {
    const p = positions[n.id]; if (!p) continue;
    nodeLayer.appendChild(buildNode(n, p, lineage));
  }

  document.getElementById("graphStats").textContent =
    `${graph.nodes.length} nodes · ${graph.edges.length} edges`;

  renderMinimap();
}

/* ============================================================
   Lineage: ancestors + descendants of the selected node.
   Returns null when nothing is selected (fade is then disabled).
   ============================================================ */
function computeLineage(graph, selectedId) {
  if (!selectedId) return null;
  const parents = {};
  const kids    = {};
  for (const n of graph.nodes) {
    parents[n.id] = n.parent_id || null;
    kids[n.id]    = [];
  }
  for (const e of graph.edges) {
    if (e.kind !== "branch") continue;
    if (kids[e.source] && parents.hasOwnProperty(e.target)) kids[e.source].push(e.target);
  }
  const ancestors = new Set();
  let cur = parents[selectedId];
  while (cur && !ancestors.has(cur)) { ancestors.add(cur); cur = parents[cur]; }
  const descendants = new Set();
  const stack = [...(kids[selectedId] || [])];
  while (stack.length) {
    const id = stack.pop();
    if (descendants.has(id)) continue;
    descendants.add(id);
    for (const c of (kids[id] || [])) stack.push(c);
  }
  const set = new Set([selectedId, ...ancestors, ...descendants]);
  return { set, ancestors, descendants, selected: selectedId };
}

/* ============================================================
   Node card builder
   ============================================================ */
function buildNode(n, p, lineage) {
  const info = stageInfo(n.stage);
  const color = nodeColor(n);
  const isSelected = state.selected === n.id;
  const isFrontier = !!(n.frontier || n.active);
  const evCount = Number(n.evidence_count) || 0;

  const classes = ["node"];
  if (isSelected) classes.push("selected");
  if (lineage) {
    if (lineage.set.has(n.id)) {
      if (lineage.ancestors.has(n.id))   classes.push("lineage-ancestor");
      if (lineage.descendants.has(n.id)) classes.push("lineage-descendant");
    } else {
      classes.push("faded");
    }
  }
  const g = makeSvg("g");
  g.setAttribute("class", classes.join(" "));
  g.setAttribute("transform", `translate(${p.x},${p.y})`);
  g.setAttribute("data-node-id", n.id);
  g.setAttribute("tabindex", "0");
  g.setAttribute("role", "button");
  g.addEventListener("click", () => selectNode(n.id, { reveal: true }));
  g.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectNode(n.id, { reveal: true }); }
  });

  // Card
  const card = makeSvg("rect");
  card.setAttribute("class", "node-card");
  card.setAttribute("width", NODE_W);
  card.setAttribute("height", NODE_H);
  card.setAttribute("rx", 8); card.setAttribute("ry", 8);
  g.appendChild(card);

  // Stripe (status-colored vertical bar at left)
  const stripe = makeSvg("rect");
  stripe.setAttribute("class", "node-stripe");
  stripe.setAttribute("x", 0); stripe.setAttribute("y", 0);
  stripe.setAttribute("width", isSelected ? 6 : 4);
  stripe.setAttribute("height", NODE_H);
  stripe.setAttribute("fill", color);
  g.appendChild(stripe);

  // Top-right indicator: frontier pulse and/or ev badge
  const rightSlots = [];
  if (isFrontier) rightSlots.push({ kind: "pulse" });
  if (evCount > 0) rightSlots.push({ kind: "ev", count: evCount });
  let rightX = NODE_W - 12;
  for (const slot of rightSlots) {
    if (slot.kind === "pulse") {
      const pulseG = makeSvg("g");
      pulseG.setAttribute("transform", `translate(${rightX - 4}, 14)`);
      pulseG.innerHTML = `
        <circle class="node-frontier-halo" r="3.5" opacity="0.32">
          <animate attributeName="r" values="3.5;9;3.5" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.32;0;0.32" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle class="node-frontier-dot" r="3.2">
          <animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <title>Frontier — active branch</title>`;
      g.appendChild(pulseG);
      rightX -= 18;
    } else if (slot.kind === "ev") {
      const evW = 30;
      const evG = buildEvBadge(slot.count, evW);
      evG.setAttribute("transform", `translate(${rightX - evW}, 8)`);
      g.appendChild(evG);
      rightX -= (evW + 6);
    }
  }

  // Icon (top-left)
  const iconX = 14, iconY = 9;
  if (info.icon) {
    const iconSvg = makeSvg("svg");
    iconSvg.setAttribute("x", iconX);
    iconSvg.setAttribute("y", iconY);
    iconSvg.setAttribute("width", 13);
    iconSvg.setAttribute("height", 13);
    iconSvg.setAttribute("viewBox", "0 0 24 24");
    iconSvg.setAttribute("overflow", "visible");
    const iconG = makeSvg("g");
    iconG.setAttribute("class", "node-icon");
    iconG.innerHTML = STAGE_ICON_PATHS[info.icon];
    iconSvg.appendChild(iconG);
    g.appendChild(iconSvg);
  }

  // Stage label (uppercase, small caps style)
  const stageT = makeSvg("text");
  stageT.setAttribute("class", "node-stage-label");
  stageT.setAttribute("x", info.icon ? 32 : 14);
  stageT.setAttribute("y", 19);
  stageT.textContent = info.label.toUpperCase();
  g.appendChild(stageT);

  // Id (primary line)
  const idT = makeSvg("text");
  idT.setAttribute("class", "node-id-text");
  idT.setAttribute("x", 14);
  idT.setAttribute("y", 46);
  idT.textContent = trimText(n.id, 30);
  g.appendChild(idT);

  // Status text (bottom-left, status-colored)
  const statusT = makeSvg("text");
  statusT.setAttribute("class", "node-status-line");
  statusT.setAttribute("x", 14);
  statusT.setAttribute("y", 70);
  statusT.setAttribute("fill", color);
  const statusLabel = n.card_label || n.state_label || n.node_state || "Unknown";
  statusT.textContent = "● " + statusLabel;
  g.appendChild(statusT);

  // Approximate width of status text (no SVG measurement at build time).
  const statusTextW = 14 + 12 + statusLabel.length * 6.6;

  // Branch ↺ badge (control-flow colored, separate from status color)
  if (n.branch_badge && Array.isArray(n.branch_badge.event_ids) && n.branch_badge.event_ids.length) {
    const bx = Math.min(NODE_W - 22, statusTextW + 6);
    const bg = makeSvg("g");
    bg.setAttribute("transform", `translate(${bx}, 60)`);
    bg.setAttribute("aria-label", `${n.branch_badge.label || "Branch"}: ${n.branch_badge.event_ids.join(", ")}`);
    bg.style.color = COLOR_VAR[n.branch_badge.color] || COLOR_VAR[presColor("event_role", n.branch_badge.role)] || "var(--purple)";
    bg.innerHTML = `
      <circle class="branch-badge" cx="7" cy="7" r="7"/>
      <svg x="1" y="1" width="12" height="12" viewBox="0 0 24 24" overflow="visible">
        <g class="branch-badge-icon">
          <polyline points="3 4 3 10 9 10"/>
          <path d="M4 11a8 8 0 1 1 2.5 6"/>
        </g>
      </svg>
      <title>${escapeHtml(n.branch_badge.label || "Branch")}: ${escapeHtml(n.branch_badge.event_ids.join(", "))}</title>`;
    g.appendChild(bg);
  }

  // Meta (bottom-right, monospace, e.g. "−1432 cm⁻¹", "ΔE‡ 14.2 kcal")
  if (n.meta) {
    const metaT = makeSvg("text");
    metaT.setAttribute("class", "node-meta-text");
    metaT.setAttribute("x", NODE_W - 12);
    metaT.setAttribute("y", 70);
    metaT.setAttribute("text-anchor", "end");
    metaT.textContent = String(n.meta);
    g.appendChild(metaT);
  }

  // Node status tooltip on hover (native SVG <title>)
  if (n.state_line) {
    const t = makeSvg("title");
    t.textContent = n.state_line ? `${statusLabel}: ${n.state_line}` : statusLabel;
    g.appendChild(t);
  }

  return g;
}

function buildEdge(e, s, t, lineage) {
  const back = e.kind === "branch_anchor";

  // Endpoint dots sit a small gap OUTSIDE the source/target nodes, so the curve
  // visibly connects two free-floating circles rather than stabbing the cards.
  // Anchor edges point back to the branch anchor; lineage/generated edges flow forward.
  const pad = 5;
  let x1, y1, x2, y2;
  if (back) {
    x1 = s.x - pad;           y1 = s.y + NODE_H / 2;
    x2 = t.x + NODE_W + pad;  y2 = t.y + NODE_H / 2;
  } else {
    x1 = s.x + NODE_W + pad;  y1 = s.y + NODE_H / 2;
    x2 = t.x - pad;           y2 = t.y + NODE_H / 2;
  }

  // Mirror cubic-bezier handles by direction of travel; clamp curve aggression.
  const dir = back ? -1 : 1;
  const dx  = Math.abs(x2 - x1);
  const mid = Math.min(110, Math.max(28, dx * 0.45));
  const c1x = x1 + dir * mid;
  const c2x = x2 - dir * mid;
  const d   = `M ${x1} ${y1} C ${c1x} ${y1}, ${c2x} ${y2}, ${x2} ${y2}`;

  const backStateClass = back && e.event_state ? `branch-${String(e.event_state)}` : "";
  const classes = ["edge-group", e.kind];
  if (backStateClass) classes.push(backStateClass);
  if (lineage) {
    const sIn = lineage.set.has(e.source);
    const tIn = lineage.set.has(e.target);
    if (sIn && tIn) classes.push("lineage");
    else            classes.push("faded");
  }
  const g = makeSvg("g");
  g.setAttribute("class", classes.join(" "));
  g.style.color = COLOR_VAR[e.edge_color] || COLOR_VAR[presColor("edge_kind", e.kind)] || "var(--grey)";

  const path = makeSvg("path");
  path.setAttribute("d", d);
  path.setAttribute("class", ["edge", e.kind, backStateClass].filter(Boolean).join(" "));
  g.appendChild(path);

  // Hollow ring at the source, solid dot at the target — encodes flow direction.
  for (const ep of [{ cx: x1, cy: y1, role: "source", r: 3.2 },
                    { cx: x2, cy: y2, role: "target", r: 3.2 }]) {
    const dot = makeSvg("circle");
    dot.setAttribute("cx", ep.cx);
    dot.setAttribute("cy", ep.cy);
    dot.setAttribute("r", ep.r);
    dot.setAttribute("class", `edge-dot ${ep.role} ${e.kind}`);
    g.appendChild(dot);
  }

  if (e.reason || e.event_state) {
    const tt = makeSvg("title");
    tt.textContent = e.event_state ? `[${e.event_state}] ${e.reason || ""}`.trim() : e.reason;
    g.appendChild(tt);
  }
  return g;
}

function buildEvBadge(count, width) {
  const evG = makeSvg("g");
  const r = makeSvg("rect");
  r.setAttribute("class", "node-ev-bg");
  r.setAttribute("width", width); r.setAttribute("height", 16);
  r.setAttribute("rx", 8); r.setAttribute("ry", 8);
  const t = makeSvg("text");
  t.setAttribute("class", "node-ev");
  t.setAttribute("x", width / 2);
  t.setAttribute("y", 11);
  t.setAttribute("text-anchor", "middle");
  t.setAttribute("dominant-baseline", "middle");
  t.textContent = "ev " + count;
  evG.appendChild(r); evG.appendChild(t);
  const title = makeSvg("title");
  title.textContent = `${count} evidence record${count === 1 ? "" : "s"}`;
  evG.appendChild(title);
  return evG;
}

function renderMinimap() {
  const svg = document.getElementById("minimapSvg");
  const W = state.layout.width || 1;
  const H = state.layout.height || 1;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";
  const positions = state.layout.positions;
  for (const n of (state.graph?.nodes || [])) {
    const p = positions[n.id]; if (!p) continue;
    const r = makeSvg("rect");
    r.setAttribute("x", p.x); r.setAttribute("y", p.y);
    r.setAttribute("width", NODE_W); r.setAttribute("height", NODE_H);
    r.setAttribute("rx", 6);
    r.setAttribute("fill", nodeColor(n));
    r.setAttribute("opacity", "0.55");
    svg.appendChild(r);
  }
  const wrap = document.getElementById("graphWrap");
  const vpW = wrap.clientWidth / state.zoom;
  const vpH = wrap.clientHeight / state.zoom;
  const vpX = -state.pan.x / state.zoom;
  const vpY = -state.pan.y / state.zoom;
  const r = makeSvg("rect");
  r.setAttribute("class", "vp");
  r.setAttribute("x", vpX); r.setAttribute("y", vpY);
  r.setAttribute("width", vpW); r.setAttribute("height", vpH);
  svg.appendChild(r);
}

/* ============================================================
   Pan + zoom
   ============================================================ */
function fitGraph() {
  const wrap = document.getElementById("graphWrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const W = state.layout.width || 1, H = state.layout.height || 1;
  const z = Math.min(w / (W + 60), h / (H + 60), 1);
  state.zoom = z;
  state.pan = {
    x: (w - W * z) / 2,
    y: (h - H * z) / 2
  };
  applyTransform();
}
function resetGraph() {
  state.zoom = 1;
  state.pan = { x: 40, y: 40 };
  applyTransform();
}
function zoomBy(delta, cx, cy) {
  const z0 = state.zoom;
  const z1 = clamp(z0 * delta, 0.2, 3);
  if (z1 === z0) return;
  const wrap = document.getElementById("graphWrap");
  const r = wrap.getBoundingClientRect();
  const px = (cx ?? r.width / 2) - state.pan.x;
  const py = (cy ?? r.height / 2) - state.pan.y;
  state.pan.x -= px * (z1 / z0 - 1);
  state.pan.y -= py * (z1 / z0 - 1);
  state.zoom = z1;
  applyTransform();
}
function applyTransform() {
  document.getElementById("viewport").setAttribute(
    "transform",
    `translate(${state.pan.x},${state.pan.y}) scale(${state.zoom})`
  );
  document.getElementById("zoomReadout").textContent = Math.round(state.zoom * 100) + "%";
  renderMinimap();
}

function setupGraphInteraction() {
  const wrap = document.getElementById("graphWrap");

  // pan
  wrap.addEventListener("pointerdown", ev => {
    if (ev.button !== 0) return;
    const target = ev.target;
    const nodeEl = target.closest?.("[data-node-id]");
    state.drag = {
      pointerId: ev.pointerId,
      startX: ev.clientX, startY: ev.clientY,
      origPan: { ...state.pan },
      nodeId: nodeEl?.getAttribute("data-node-id") || null,
      moved: false
    };
    wrap.setPointerCapture(ev.pointerId);
    wrap.classList.add("dragging");
  });
  wrap.addEventListener("pointermove", ev => {
    if (!state.drag || state.drag.pointerId !== ev.pointerId) return;
    const dx = ev.clientX - state.drag.startX;
    const dy = ev.clientY - state.drag.startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) state.drag.moved = true;
    if (state.drag.moved) {
      state.pan = { x: state.drag.origPan.x + dx, y: state.drag.origPan.y + dy };
      applyTransform();
    }
  });
  const stop = ev => {
    if (!state.drag || state.drag.pointerId !== ev.pointerId) return;
    if (!state.drag.moved && state.drag.nodeId) {
      selectNode(state.drag.nodeId, { reveal: true });
    }
    state.drag = null;
    wrap.classList.remove("dragging");
  };
  wrap.addEventListener("pointerup", stop);
  wrap.addEventListener("pointercancel", stop);

  // wheel
  wrap.addEventListener("wheel", ev => {
    if (ev.ctrlKey || ev.metaKey || ev.shiftKey) {
      ev.preventDefault();
      const r = wrap.getBoundingClientRect();
      const delta = Math.exp(-ev.deltaY * 0.002);
      zoomBy(delta, ev.clientX - r.left, ev.clientY - r.top);
    } else {
      ev.preventDefault();
      state.pan.x -= ev.deltaX;
      state.pan.y -= ev.deltaY;
      applyTransform();
    }
  }, { passive: false });

  // resize
  new ResizeObserver(() => renderMinimap()).observe(wrap);
}

/* ============================================================
   Node selection / right panel
   ============================================================ */
async function selectNode(id, opts = {}) {
  state.selected = id;
  if (opts.reveal) setPanelCollapsed("right", false);
  // Re-render graph immediately so the lineage fade follows the click,
  // without waiting on the node fetch.
  renderGraph();
  try {
    const path = workspaceApi(`/node/${encodeURIComponent(id)}`);
    state.nodePayload = await api(path);
  } catch (err) {
    state.nodePayload = { error: String(err) };
  }
  renderNode();
}

function clearSelection() {
  if (!state.selected) return;
  state.selected = null;
  state.nodePayload = null;
  renderGraph();
  renderEmptyNode();
}

function renderNode() {
  const payload = state.nodePayload || {};
  const node = payload.node || {};
  const head = document.getElementById("nodeHead");
  const statusLine = node.card_line || node.state_line || node.state_label || node.node_state || "Unknown";
  const statusColor = node.card_color || node.color || presColor("node_state", node.node_state);
  const stageLabel = node.stage_label || stageInfo(node.stage).label || node.stage;
  head.innerHTML = node.node_id || payload.node_id ? `
    <span class="id">${escapeHtml(payload.node_id || node.node_id || "")}</span>
    <span class="chip" data-color="${escapeHtml(statusColor)}" title="${escapeHtml(node.reason_code || node.program_status || "")}">${escapeHtml(statusLine)}</span>
    ${node.stage ? `<span class="chip no-dot" title="${escapeHtml(node.stage)}">${escapeHtml(stageLabel)}</span>` : ""}
  ` : `<span class="muted">No node selected.</span>`;

  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = TABS.map(([id, label]) =>
      `<button class="tab${state.tab === id ? " active" : ""}" data-tab="${id}" role="tab" translate="no">${label}</button>`
    ).join("");
  tabsEl.querySelectorAll(".tab").forEach(el => {
    el.addEventListener("click", () => { state.tab = el.dataset.tab; renderNode(); });
  });

  const d = document.getElementById("detail");
  if (state.tab === "summary") {
    d.innerHTML = renderSummary(payload, node);
  } else if (state.tab === "rationale") {
    d.innerHTML = renderRationale(payload);
  } else if (state.tab === "reflection") {
    const text = payload.markdown?.[state.tab] || "";
    d.innerHTML = text
      ? `<div class="md">${renderMarkdown(text)}</div>`
      : emptyBlock("No content.", "This node has no reflection.");
  } else if (state.tab === "decisions") {
    d.innerHTML = renderDecisionTimeline(payload.node_id || node.node_id);
  } else if (state.tab === "evidence") {
    const items = payload.evidence || [];
    if (!items.length) { d.innerHTML = emptyBlock("No evidence.", "Nothing recorded for this node yet."); return; }
    d.innerHTML = items.map(ev => `
      <div style="padding:10px 12px; border:1px solid var(--border); border-radius:var(--r-sm); margin-bottom:8px; background: var(--surface-2);">
        <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">
          <span class="chip size-sm" data-color="${escapeHtml(ev.evidence_color || presColor("evidence_state", ev.evidence_state))}">${escapeHtml(ev.evidence_label || ev.evidence_state || "—")}</span>
          <span class="chip size-sm no-dot">${escapeHtml(ev.kind || "—")}</span>
        </div>
        <div style="font-size:13px">${escapeHtml(ev.claim || "")}</div>
        ${ev.source ? `<div class="muted" style="font-family: var(--font-mono); font-size: 11.5px; margin-top:4px;">${escapeHtml(ev.source)}</div>` : ""}
      </div>
    `).join("");
  } else if (state.tab === "files") {
    const files = payload.files?.files || [];
    const notes = payload.file_notes || [];
    if (!files.length) { d.innerHTML = emptyBlock("No files.", "No artifacts in this node directory."); return; }
    const notesHtml = notes.length ? `<div style="margin-bottom:10px;">${notes.map(note => `
      <div class="summary-card" style="margin-bottom:8px;">
        <div class="summary-title">${escapeHtml(note.kind || "File note")}</div>
        <div class="summary-text">${escapeHtml(note.message || "")}</div>
        ${note.source ? `<div class="muted mono" style="margin-top:4px;">${escapeHtml(note.source)}</div>` : ""}
      </div>`).join("")}</div>` : "";
    d.innerHTML = `${notesHtml}<div class="files">${files.map(f => {
      const slash    = f.path.lastIndexOf("/");
      const filename = slash >= 0 ? f.path.slice(slash + 1) : f.path;
      const dirpath  = slash >= 0 ? f.path.slice(0, slash + 1) : "";
      const dot      = filename.lastIndexOf(".");
      const ext      = dot >= 0 ? filename.slice(dot + 1).toLowerCase() : "";
      return `
      <div class="file-row" data-file="${escapeHtml(f.path)}" title="${escapeHtml(f.path)}" tabindex="0" role="button">
        <svg class="file-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${fileIcon(ext)}</svg>
        <span class="file-name">${escapeHtml(filename)}</span>
        <span class="file-size">${fmtSize(f.size)}</span>
        <span class="file-action"><button class="btn">View</button></span>
        ${dirpath ? `<span class="file-path">${escapeHtml(dirpath)}</span>` : ""}
      </div>`;
    }).join("")}</div>`;
    d.querySelectorAll(".file-row").forEach(row => {
      row.addEventListener("click", () => loadFile(row.dataset.file));
      row.addEventListener("keydown", ev => {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); loadFile(row.dataset.file); }
      });
    });
  } else if (state.tab === "json") {
    d.innerHTML = `<div class="json">${jsonHighlight(payload)}</div>`;
  }
}

function renderSummary(payload, node) {
  const hypothesis = node.hypothesis || "";
  const action = node.decision || "";
  return `<div class="summary-stack">
    <div class="summary-card primary">
      <div class="summary-title">Hypothesis</div>
      <div class="summary-text${hypothesis ? "" : " muted"}">${hypothesis ? escapeHtml(hypothesis) : "No node hypothesis recorded."}</div>
    </div>
    <div class="summary-card">
      <div class="summary-title">Status</div>
      <div class="summary-grid">
        ${summaryRow("node", payload.node_id, "mono")}
        ${summaryRow("card_status", node.card_line || node.card_label)}
        ${summaryRow("card_phase", node.card_phase, "mono")}
        ${summaryRow("state", node.node_state, "chip", "node_state")}
        ${summaryRow("state_line", node.state_line)}
        ${summaryRow("stage", node.stage)}
        ${summaryRow("lifecycle", node.lifecycle, "mono")}
        ${summaryRow("program_status", node.program_status, "mono")}
        ${summaryRow("claim_verdict", node.claim_verdict, "mono")}
        ${summaryRow("reason_code", node.reason_code, "mono")}
        ${summaryRow("parent", node.parent_id, "mono")}
        ${Array.isArray(node.input_refs) && node.input_refs.length ? summaryRow("input_refs", node.input_refs.join(", "), "mono") : ""}
        ${Array.isArray(node.branch_event_ids) && node.branch_event_ids.length ? summaryRow("branch_events", node.branch_event_ids.join(", "), "mono") : ""}
        ${Array.isArray(node.generated_from_branch_event_ids) && node.generated_from_branch_event_ids.length ? summaryRow("generated_from_branch", node.generated_from_branch_event_ids.join(", "), "mono") : ""}
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-title">Latest Action</div>
      <div class="summary-text${action ? " action-token" : " muted"}">${action ? escapeHtml(action) : "No latest action recorded."}</div>
    </div>
  </div>`;
}

function renderRationale(payload) {
  const hypothesis = payload.markdown?.hypothesis || "";
  const decision = payload.markdown?.decision_card || "";
  if (!hypothesis && !decision) {
    return emptyBlock("No rationale.", "This node has no hypothesis or decision card markdown.");
  }
  const parts = [];
  const lint = payload.rationale_lint || {};
  if (lint.status && lint.status !== "complete" && lint.status !== "imported") {
    parts.push(`<div class="summary-card">
      <div class="summary-title">Rationale Status</div>
      <div class="summary-text">${escapeHtml(lint.summary || "Pre-execution rationale is incomplete.")}</div>
    </div>`);
  }
  if (hypothesis) {
    parts.push(`<section class="md"><h2>Hypothesis Detail</h2>${renderMarkdown(hypothesis)}</section>`);
  }
  if (decision) {
    parts.push(`<section class="md"><h2>Decision Card</h2>${renderMarkdown(decision)}</section>`);
  }
  return `<div class="summary-stack">${parts.join("")}</div>`;
}

function chipFor(group, value) {
  return `<span class="chip" data-color="${escapeHtml(presColor(group, value))}">${escapeHtml(presLabel(group, value))}</span>`;
}
function summaryRow(k, v, cls, group) {
  if (v === null || v === undefined || v === "") return "";
  if (cls === "chip") {
    return `<div class="k">${escapeHtml(k)}</div><div class="v">${chipFor(group || "node_state", v)}</div>`;
  }
  if (cls === "mono") return `<div class="k">${escapeHtml(k)}</div><div class="v mono">${escapeHtml(String(v))}</div>`;
  return `<div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(String(v))}</div>`;
}

function renderDecisionTimeline(nodeId) {
  const events = (state.graph?.events || []).filter(d => d && d.node_id === nodeId);
  if (!events.length) return emptyBlock("No timeline.", "No events recorded for this node.");
  return `<div class="timeline">${events.map(d => `
    <div class="timeline-item">
      <div class="timeline-action">${escapeHtml(d.decision || d.event_type || "event")}</div>
      ${d.reason ? `<div class="summary-text">${escapeHtml(d.reason)}</div>` : ""}
      ${Array.isArray(d.evidence_refs) && d.evidence_refs.length ? `<div class="timeline-evidence">${escapeHtml(d.evidence_refs.join(", "))}</div>` : ""}
    </div>
  `).join("")}</div>`;
}

function kvRow(k, v, cls, group) {
  if (v === null || v === undefined || v === "") {
    return `<div class="k">${escapeHtml(k)}</div><div class="v"><span class="muted">—</span></div>`;
  }
  if (cls === "chip") return `<div class="k">${escapeHtml(k)}</div><div class="v">${chipFor(group || "node_state", v)}</div>`;
  if (cls === "mono") return `<div class="k">${escapeHtml(k)}</div><div class="v mono">${escapeHtml(String(v))}</div>`;
  return `<div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(String(v))}</div>`;
}

/* ============================================================
   Markdown (tiny) + JSON highlighter
   ============================================================ */
function renderMarkdown(src) {
  // escape first
  let s = String(src).replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));
  // fenced code
  s = s.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_, lang, body) =>
    `<pre><code>${body.replace(/\n$/, "")}</code></pre>`);
  // headers
  s = s.replace(/^(#{1,6})\s+(.*)$/gm, (_, h, text) => `<h${h.length}>${text}</h${h.length}>`);
  // hr
  s = s.replace(/^---$/gm, "<hr>");
  // blockquote
  s = s.replace(/^>\s?(.*)$/gm, "<blockquote>$1</blockquote>");
  // bold / em
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");
  // inline code
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  // links
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, href) => {
    const safe = safeLinkHref(href);
    return safe
      ? `<a href="${escapeAttr(safe)}" target="_blank" rel="noreferrer noopener">${text}</a>`
      : text;
  });
  // lists (very small): consecutive "- " lines
  s = s.replace(/(^|\n)((?:- .*(?:\n|$))+)/g, (_, pre, block) => {
    const items = block.trim().split("\n").map(l => `<li>${l.replace(/^- /, "")}</li>`).join("");
    return `${pre}<ul>${items}</ul>`;
  });
  s = s.replace(/(^|\n)((?:\d+\. .*(?:\n|$))+)/g, (_, pre, block) => {
    const items = block.trim().split("\n").map(l => `<li>${l.replace(/^\d+\. /, "")}</li>`).join("");
    return `${pre}<ol>${items}</ol>`;
  });
  // paragraphs: wrap non-block lines
  s = s.split(/\n{2,}/).map(chunk => {
    if (/^\s*<(h\d|ul|ol|pre|blockquote|hr)/.test(chunk.trim())) return chunk;
    return `<p>${chunk.replace(/\n/g, "<br>")}</p>`;
  }).join("\n");
  return s;
}

function jsonHighlight(value) {
  function render(v, indent = 0) {
    if (v === null) return `<span class="null">null</span>`;
    if (typeof v === "number") return `<span class="n">${v}</span>`;
    if (typeof v === "boolean") return `<span class="b">${v}</span>`;
    if (typeof v === "string") return `<span class="s">"${escapeHtml(v)}"</span>`;
    if (Array.isArray(v)) {
      if (!v.length) return "[]";
      return `<details ${indent < 2 ? "open" : ""}><summary>[ <span class="muted">${v.length} items</span> ]</summary><div>` +
        v.map(item => `<div>${render(item, indent + 1)},</div>`).join("") +
        `</div></details>`;
    }
    if (typeof v === "object") {
      const keys = Object.keys(v);
      if (!keys.length) return "{}";
      return `<details ${indent < 2 ? "open" : ""}><summary>{ <span class="muted">${keys.length} fields</span> }</summary><div>` +
        keys.map(k => `<div><span class="k">"${escapeHtml(k)}"</span>: ${render(v[k], indent + 1)},</div>`).join("") +
        `</div></details>`;
    }
    return escapeHtml(String(v));
  }
  return render(value);
}

/* ============================================================

        : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`)
    : (collapsed
        ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`
        : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`);
}

/* ============================================================
   Panel resize
   ============================================================ */
function applyStoredPanelWidths() {
  const left = Number(localStorage.getItem("ts-w-left"));
  const right = Number(localStorage.getItem("ts-w-right"));
  if (Number.isFinite(left)) setPanelWidth("left", left, false);
  if (Number.isFinite(right)) setPanelWidth("right", right, false);
}
function panelWidthBounds(side) {
  const root = getComputedStyle(document.documentElement);
  const min = parseFloat(root.getPropertyValue(side === "left" ? "--w-left-min" : "--w-right-min")) || 240;
  const max = parseFloat(root.getPropertyValue(side === "left" ? "--w-left-max" : "--w-right-max")) || 720;
  return { min, max };
}
function setPanelWidth(side, px, persist = true) {
  const { min, max } = panelWidthBounds(side);
  const value = Math.round(clamp(px, min, max));
  document.documentElement.style.setProperty(side === "left" ? "--w-left" : "--w-right", `${value}px`);
  if (persist) localStorage.setItem(side === "left" ? "ts-w-left" : "ts-w-right", String(value));
  return value;
}
function initPanelResizer(side) {
  const handle = document.getElementById(side === "left" ? "leftResizer" : "rightResizer");
  if (!handle) return;
  const app = document.getElementById("app");
  let startX = 0;
  let startW = 0;
  let pointerId = null;
  let active = false;

  function begin(clientX, id = null) {
    if (app.classList.contains(side === "left" ? "left-collapsed" : "right-collapsed")) return;
    const panel = document.getElementById(side === "left" ? "leftPanel" : "rightPanel");
    startX = clientX;
    startW = panel.getBoundingClientRect().width;
    pointerId = id;
    active = true;
    handle.classList.add("dragging");
    document.body.classList.add("resizing-panels");
  }
  function move(clientX) {
    if (!active) return;
    const delta = clientX - startX;
    const next = side === "left" ? startW + delta : startW - delta;
    setPanelWidth(side, next);
    renderMinimap();
  }
  function end() {
    if (!active) return;
    if (pointerId !== null && handle.releasePointerCapture) {
      try { handle.releasePointerCapture(pointerId); } catch {}
    }
    pointerId = null;
    active = false;
    handle.classList.remove("dragging");
    document.body.classList.remove("resizing-panels");
  }

  handle.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    handle.setPointerCapture?.(ev.pointerId);
    begin(ev.clientX, ev.pointerId);
  });
  window.addEventListener("pointermove", ev => move(ev.clientX));
  window.addEventListener("pointerup", end);
  handle.addEventListener("keydown", ev => {
    if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
    ev.preventDefault();
    const panel = document.getElementById(side === "left" ? "leftPanel" : "rightPanel");
    const step = ev.shiftKey ? 40 : 16;
    const dir = ev.key === "ArrowRight" ? 1 : -1;
    const next = side === "left"
      ? panel.getBoundingClientRect().width + dir * step
      : panel.getBoundingClientRect().width - dir * step;
    setPanelWidth(side, next);
    renderMinimap();
  });
}
function initPanelResizers() {
  applyStoredPanelWidths();
  initPanelResizer("left");
  initPanelResizer("right");
}

/* ============================================================
   Utilities
   ============================================================ */
function makeSvg(name) { return document.createElementNS("http://www.w3.org/2000/svg", name); }
function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, "&#96;"); }
function safeLinkHref(href) {
  const raw = String(href || "").trim();
  if (!raw || /[\u0000-\u001f\u007f\s"'<>`]/.test(raw)) return "";
  const lowered = raw.toLowerCase();
  if (lowered.startsWith("#") || lowered.startsWith("./") || lowered.startsWith("../") || lowered.startsWith("/")) return raw;
  if (/^(https?|mailto):/.test(lowered)) return raw;
  return "";
}
function trimText(s, max) { s = String(s || ""); return s.length > max ? s.slice(0, max - 1) + "…" : s; }
function shortPath(s) { s = String(s || ""); return s.length > 60 ? "…" + s.slice(-57) : s; }
function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
function fmtSize(n) {
  if (!Number.isFinite(n)) return "—";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + " MB";
  return (n / 1024 / 1024 / 1024).toFixed(2) + " GB";
}
function fileIcon(ext) {
  // 14×14 in a 24×24 viewBox; stroke-only paths.
  switch (ext) {
    case "json":
      return '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
             '<polyline points="14 2 14 8 20 8"/>' +
             '<path d="M10 14c-1 .8-1 2.2 0 3M14 14c1 .8 1 2.2 0 3"/>';
    case "md":
    case "markdown":
      return '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
             '<polyline points="14 2 14 8 20 8"/>' +
             '<path d="M8 17v-4l2 2 2-2v4M14 13v4M14 17l1.5-1.5L17 17"/>';
    case "xyz":
    case "mol":
    case "pdb":
      return '<circle cx="7" cy="9" r="1.6"/><circle cx="17" cy="9" r="1.6"/><circle cx="12" cy="17" r="1.6"/>' +
             '<line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="9" x2="12" y2="17"/><line x1="17" y1="9" x2="12" y2="17"/>';
    case "out":
    case "log":
    case "txt":
      return '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
             '<polyline points="14 2 14 8 20 8"/>' +
             '<line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/>';
    case "chk":
    case "fchk":
    case "rwf":
      return '<rect x="4" y="6" width="16" height="12" rx="1.5"/>' +
             '<line x1="4" y1="10" x2="20" y2="10"/>' +
             '<line x1="8" y1="14" x2="8" y2="16"/><line x1="12" y1="14" x2="12" y2="16"/><line x1="16" y1="14" x2="16" y2="16"/>';
    case "csv":
    case "tsv":
      return '<rect x="4" y="4" width="16" height="16" rx="1.5"/>' +
             '<line x1="4" y1="10" x2="20" y2="10"/>' +
             '<line x1="4" y1="15" x2="20" y2="15"/>' +
             '<line x1="12" y1="4" x2="12" y2="20"/>';
    default:
      return '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
             '<polyline points="14 2 14 8 20 8"/>';
  }
}
function toast(msg) {
  const wrap = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateY(8px)"; el.style.transition = "200ms"; }, 1600);
  setTimeout(() => el.remove(), 2000);
}

/* ============================================================
   Keyboard
   ============================================================ */
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA") return;
  if (ev.key === "Escape") { clearSelection(); }
  else if (ev.key === "r" || ev.key === "R") { loadWorkspaceData(); }
  else if (ev.key === "t" || ev.key === "T") { toggleTheme(); }
  else if (ev.key === "f" || ev.key === "F") { fitGraph(); }
  else if (ev.key === "0") { resetGraph(); }
  else if (ev.key === "+" || ev.key === "=") { zoomBy(1.15); }
  else if (ev.key === "-" || ev.key === "_") { zoomBy(1 / 1.15); }
  else if (ev.key === "[") { setPanelCollapsed("left", !document.getElementById("app").classList.contains("left-collapsed")); }
  else if (ev.key === "]") { setPanelCollapsed("right", !document.getElementById("app").classList.contains("right-collapsed")); }
  else if (ev.key === "j" || ev.key === "k") {
    if (!state.graph) return;
    const ids = state.graph.nodes.map(n => n.id);
    const i = ids.indexOf(state.selected);
    const next = ids[clamp(i + (ev.key === "j" ? 1 : -1), 0, ids.length - 1)];
    if (next) selectNode(next, { reveal: true });
  }
});
