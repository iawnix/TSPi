<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TS Research Explorer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101210;
      --surface: #171a18;
      --surface-2: #1e221f;
      --surface-3: #252a26;
      --line: #353b36;
      --line-soft: #292e2a;
      --text: #edf1ed;
      --muted: #a3aba4;
      --dim: #737c74;
      --green: #67c48e;
      --cyan: #6bbaca;
      --amber: #dcad5f;
      --red: #e57878;
      --violet: #aa91d8;
      --focus: #8bd4a8;
      --sidebar: 224px;
      --inspector: 360px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    body { overflow: hidden; }
    button, input, select { font: inherit; letter-spacing: 0; }
    button { color: inherit; }

    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 210px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid #4c6656;
      border-radius: 5px;
      background: #1b2b20;
      color: var(--green);
      font: 700 16px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .brand-copy { min-width: 0; }
    .brand-title { font-size: 14px; font-weight: 650; line-height: 1.2; }
    .brand-protocol { margin-top: 2px; color: var(--dim); font-size: 11px; line-height: 1.2; }

    .workspace-control {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-left: auto;
    }

    select, .search-input {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-2);
      color: var(--text);
      outline: none;
    }
    select { max-width: 280px; padding: 0 30px 0 10px; }
    select:focus, .search-input:focus { border-color: var(--focus); box-shadow: 0 0 0 2px #67c48e22; }

    .icon-button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-2);
      cursor: pointer;
    }
    .icon-button:hover { background: var(--surface-3); border-color: #4a524b; }

    .health {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: max-content;
      color: var(--muted);
      font-size: 12px;
    }
    .health-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    .health.valid .health-dot { background: var(--green); }
    .health.invalid .health-dot { background: var(--red); }

    .shell {
      height: calc(100vh - 58px);
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr) 0;
      transition: grid-template-columns 160ms ease;
    }
    body.inspector-open .shell { grid-template-columns: var(--sidebar) minmax(0, 1fr) var(--inspector); }

    .sidebar {
      min-width: 0;
      padding: 14px 10px;
      border-right: 1px solid var(--line);
      background: #141715;
      overflow-y: auto;
    }

    .nav-heading {
      margin: 10px 10px 7px;
      color: var(--dim);
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
    }

    .nav-button {
      width: 100%;
      min-height: 38px;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .nav-button:hover { background: var(--surface-2); }
    .nav-button.active { border-color: #3d5646; background: #1b2a20; color: #dff5e7; }
    .nav-icon { color: var(--muted); font-size: 15px; text-align: center; }
    .nav-count { min-width: 22px; color: var(--dim); font-size: 11px; text-align: right; }

    .sidebar-meta {
      margin: 18px 10px 0;
      padding-top: 14px;
      border-top: 1px solid var(--line-soft);
      color: var(--dim);
      font: 11px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-wrap: anywhere;
    }

    .workspace-main { min-width: 0; overflow: auto; background: var(--bg); }
    .content { width: 100%; max-width: 1480px; margin: 0 auto; padding: 22px 24px 80px; }

    .view-header {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 18px;
    }
    .view-heading { min-width: 0; }
    .view-heading h1 { margin: 0; font-size: 21px; font-weight: 650; line-height: 1.25; }
    .view-heading p { margin: 5px 0 0; color: var(--muted); line-height: 1.4; }
    .view-tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .search-input { width: 250px; padding: 0 10px; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(105px, 1fr));
      border: 1px solid var(--line);
      background: var(--surface);
      margin-bottom: 20px;
    }
    .metric { min-height: 72px; padding: 12px 14px; border-right: 1px solid var(--line-soft); }
    .metric:last-child { border-right: 0; }
    .metric-value { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .metric-label { margin-top: 4px; color: var(--muted); font-size: 12px; }

    .notice-stack { display: grid; gap: 8px; margin-bottom: 18px; }
    .notice {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 11px;
      border-left: 3px solid var(--amber);
      background: #2b2519;
      color: #eadfc7;
    }
    .notice.error { border-color: var(--red); background: #2b1c1c; color: #f2d7d7; }
    .notice.info { border-color: var(--cyan); background: #172629; color: #d3e9ed; }
    .notice code { color: inherit; font-size: 11px; }

    .section { margin-top: 26px; }
    .section:first-child { margin-top: 0; }
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .section-header h2 { margin: 0; font-size: 14px; font-weight: 650; }
    .section-meta { color: var(--dim); font-size: 11px; }

    .graph-viewport {
      position: relative;
      min-height: 270px;
      overflow: auto;
      border: 1px solid var(--line);
      background-color: #131614;
      background-image:
        linear-gradient(#242925 1px, transparent 1px),
        linear-gradient(90deg, #242925 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .graph-stage { position: relative; min-width: 100%; min-height: 270px; }
    .graph-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .graph-edge { fill: none; stroke: #4d5750; stroke-width: 1.5; }
    .graph-edge.claim { stroke: #557783; }
    .graph-edge-label { fill: var(--dim); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }

    .graph-node {
      position: absolute;
      width: 205px;
      min-height: 68px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--dim);
      border-radius: 5px;
      background: var(--surface-2);
      text-align: left;
      cursor: pointer;
      overflow: hidden;
    }
    .graph-node:hover { border-color: #59615a; background: var(--surface-3); }
    .graph-node.focus { box-shadow: 0 0 0 2px #67c48e33; }
    .graph-node.status-open, .graph-node.status-proposed { border-left-color: var(--cyan); }
    .graph-node.status-completed, .graph-node.status-supported, .graph-node.status-pass { border-left-color: var(--green); }
    .graph-node.status-blocked, .graph-node.status-fail, .graph-node.status-contradicted { border-left-color: var(--red); }
    .graph-node.status-inconclusive, .graph-node.status-warning { border-left-color: var(--amber); }
    .graph-node.accepted { border-top-color: var(--violet); }
    .node-top { display: flex; align-items: center; gap: 7px; }
    .node-id { min-width: 0; color: var(--muted); font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; }
    .node-state { margin-left: auto; font-size: 10px; color: var(--dim); white-space: nowrap; }
    .node-title { margin-top: 7px; font-size: 12px; line-height: 1.35; max-height: 34px; overflow: hidden; }

    .empty-state {
      min-height: 180px;
      display: grid;
      place-items: center;
      border: 1px dashed var(--line);
      color: var(--dim);
    }

    .data-table { width: 100%; border-collapse: collapse; border: 1px solid var(--line); background: var(--surface); }
    .data-table th {
      height: 36px;
      padding: 0 11px;
      border-bottom: 1px solid var(--line);
      background: #1b1f1c;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-align: left;
    }
    .data-table td { padding: 10px 11px; border-bottom: 1px solid var(--line-soft); vertical-align: top; line-height: 1.4; }
    .data-table tbody tr:last-child td { border-bottom: 0; }
    .data-table tbody tr[data-detail] { cursor: pointer; }
    .data-table tbody tr[data-detail]:hover { background: var(--surface-2); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; overflow-wrap: anywhere; }
    .muted { color: var(--muted); }
    .nowrap { white-space: nowrap; }
    .truncate { max-width: 440px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
    }
    .badge.good { border-color: #3e694f; color: #9ee0b7; background: #19271e; }
    .badge.bad { border-color: #734444; color: #f2a0a0; background: #2c1b1b; }
    .badge.warn { border-color: #735c36; color: #edc985; background: #2a2418; }
    .badge.info { border-color: #3c6972; color: #9dd5df; background: #17262a; }
    .badge.review { border-color: #66517d; color: #cbb3ed; background: #241d2c; }

    .activity-list { border: 1px solid var(--line); background: var(--surface); }
    .activity-row {
      min-height: 54px;
      display: grid;
      grid-template-columns: 26px 120px minmax(0, 1fr) 120px;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line-soft);
      cursor: pointer;
    }
    .activity-row:last-child { border-bottom: 0; }
    .activity-row:hover { background: var(--surface-2); }
    .activity-symbol { color: var(--cyan); text-align: center; }
    .activity-row.review .activity-symbol { color: var(--violet); }
    .activity-title { min-width: 0; }
    .activity-title strong { display: block; font-size: 12px; font-weight: 600; }
    .activity-title span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .activity-time { color: var(--dim); font-size: 11px; text-align: right; }

    .inspector {
      width: var(--inspector);
      min-width: 0;
      border-left: 1px solid var(--line);
      background: var(--surface);
      overflow: hidden;
    }
    .inspector-inner { width: var(--inspector); height: 100%; display: flex; flex-direction: column; }
    .inspector-header {
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .inspector-header h2 { min-width: 0; margin: 0; font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inspector-header .icon-button { margin-left: auto; }
    .inspector-body { min-height: 0; flex: 1; overflow-y: auto; padding: 14px; }
    .detail-id { color: var(--muted); font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .detail-title { margin: 10px 0 0; font-size: 16px; line-height: 1.45; }
    .detail-section { margin-top: 20px; }
    .detail-section h3 { margin: 0 0 8px; color: var(--muted); font-size: 11px; font-weight: 650; text-transform: uppercase; }
    .detail-grid { border-top: 1px solid var(--line); }
    .detail-field { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
    .detail-field dt { color: var(--dim); }
    .detail-field dd { margin: 0; overflow-wrap: anywhere; }
    .ref-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .ref-chip { padding: 3px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font: 10px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .file-button { width: 100%; padding: 7px 0; border: 0; border-bottom: 1px solid var(--line-soft); background: transparent; text-align: left; cursor: pointer; }
    .file-button:hover { color: var(--green); }
    .file-preview { margin: 10px 0 0; padding: 10px; border: 1px solid var(--line); background: #101210; color: #cbd2cc; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }

    .loading { opacity: .55; pointer-events: none; }
    .fatal { margin: 24px; padding: 16px; border-left: 3px solid var(--red); background: #2b1c1c; color: #f2d7d7; white-space: pre-wrap; }

    @media (max-width: 1120px) {
      body.inspector-open .shell { grid-template-columns: var(--sidebar) minmax(0, 1fr); }
      .inspector { position: fixed; z-index: 20; top: 58px; right: 0; bottom: 0; box-shadow: -12px 0 30px #0008; }
      .metrics { grid-template-columns: repeat(3, minmax(105px, 1fr)); }
      .metric:nth-child(3) { border-right: 0; }
      .metric:nth-child(-n+3) { border-bottom: 1px solid var(--line-soft); }
    }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .topbar { height: auto; min-height: 58px; flex-wrap: wrap; padding: 10px 12px; gap: 10px; }
      .brand { min-width: 0; }
      .workspace-control { width: 100%; order: 2; margin-left: 0; }
      .workspace-control select { min-width: 0; flex: 1; }
      .health { margin-left: auto; }
      .shell, body.inspector-open .shell { height: auto; min-height: calc(100vh - 100px); display: block; }
      .sidebar { position: sticky; top: 0; z-index: 5; display: flex; gap: 5px; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
      .nav-heading, .sidebar-meta { display: none; }
      .nav-button { width: auto; min-width: max-content; grid-template-columns: 20px auto auto; }
      .content { padding: 18px 12px 60px; }
      .view-header { display: block; }
      .view-tools { margin: 12px 0 0; }
      .search-input { width: 100%; }
      .metrics { grid-template-columns: repeat(2, minmax(105px, 1fr)); }
      .metric:nth-child(n) { border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); }
      .metric:nth-child(even) { border-right: 0; }
      .metric:nth-last-child(-n+2) { border-bottom: 0; }
      .activity-row { grid-template-columns: 24px minmax(0, 1fr) auto; }
      .activity-kind { display: none; }
      .inspector { top: 0; left: 0; width: 100%; }
      .inspector-inner { width: 100%; }
      .data-table { min-width: 700px; }
      .table-scroll { overflow-x: auto; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">TSπ</div>
      <div class="brand-copy">
        <div class="brand-title">TS Research Explorer</div>
        <div class="brand-protocol">Research Kernel v4</div>
      </div>
    </div>
    <div class="workspace-control">
      <select id="workspace-select" aria-label="Workspace"></select>
      <button class="icon-button" id="refresh-button" type="button" title="Refresh" aria-label="Refresh">↻</button>
      <div class="health" id="health"><span class="health-dot"></span><span id="health-label">Loading</span></div>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Research data">
      <div class="nav-heading">Workspace</div>
      <button class="nav-button active" type="button" data-view="overview"><span class="nav-icon">⌘</span><span>Overview</span><span class="nav-count"></span></button>
      <button class="nav-button" type="button" data-view="claims"><span class="nav-icon">◇</span><span>Claims</span><span class="nav-count" data-count="claims">0</span></button>
      <button class="nav-button" type="button" data-view="acts"><span class="nav-icon">↳</span><span>Research Acts</span><span class="nav-count" data-count="acts">0</span></button>
      <button class="nav-button" type="button" data-view="observations"><span class="nav-icon">≡</span><span>Observations</span><span class="nav-count" data-count="observations">0</span></button>
      <button class="nav-button" type="button" data-view="validation"><span class="nav-icon">✓</span><span>Validation</span><span class="nav-count" data-count="validation">0</span></button>
      <button class="nav-button" type="button" data-view="findings"><span class="nav-icon">!</span><span>Findings</span><span class="nav-count" data-count="findings">0</span></button>
      <div class="nav-heading">Operations</div>
      <button class="nav-button" type="button" data-view="activity"><span class="nav-icon">●</span><span>Activity</span><span class="nav-count" data-count="activity">0</span></button>
      <div class="sidebar-meta" id="sidebar-meta"></div>
    </nav>

    <main class="workspace-main" id="workspace-main">
      <div class="content" id="content"></div>
    </main>

    <aside class="inspector" id="inspector" aria-label="Details">
      <div class="inspector-inner">
        <div class="inspector-header">
          <h2 id="inspector-title">Details</h2>
          <button class="icon-button" id="close-inspector" type="button" title="Close" aria-label="Close">×</button>
        </div>
        <div class="inspector-body" id="inspector-body"></div>
      </div>
    </aside>
  </div>

  <script>
    "use strict";

    const state = {
      workspaceId: null,
      workspaces: [],
      view: null,
      graph: null,
      currentView: "overview",
      query: "",
    };

    const content = document.getElementById("content");
    const workspaceSelect = document.getElementById("workspace-select");
    const health = document.getElementById("health");
    const healthLabel = document.getElementById("health-label");
    const inspectorTitle = document.getElementById("inspector-title");
    const inspectorBody = document.getElementById("inspector-body");

    async function api(path) {
      const response = await fetch(path, { cache: "no-store" });
      const text = await response.text();
      let payload;
      try { payload = JSON.parse(text); } catch { throw new Error(`Invalid JSON from ${path}`); }
      if (!response.ok) throw new Error(payload.error || `${response.status} ${response.statusText}`);
      return payload;
    }

    async function boot() {
      setLoading(true);
      try {
        const payload = await api("/api/workspaces");
        state.workspaces = payload.workspaces || [];
        if (!state.workspaces.length) throw new Error("No workspace is registered.");
        const saved = localStorage.getItem("ts-explorer-workspace");
        state.workspaceId = state.workspaces.some(row => row.workspace_id === saved)
          ? saved
          : (payload.default_workspace || state.workspaces[0].workspace_id);
        renderWorkspaceOptions();
        await loadWorkspace();
      } catch (error) {
        renderFatal(error);
      } finally {
        setLoading(false);
      }
    }

    async function loadWorkspace() {
      setLoading(true);
      try {
        const base = `/api/workspace/${encodeURIComponent(state.workspaceId)}`;
        const [workspacePayload, graphPayload] = await Promise.all([api(base), api(`${base}/graph`)]);
        state.view = workspacePayload.view;
        state.graph = graphPayload;
        localStorage.setItem("ts-explorer-workspace", state.workspaceId);
        updateChrome();
        renderCurrentView();
      } catch (error) {
        renderFatal(error);
      } finally {
        setLoading(false);
      }
    }

    function renderWorkspaceOptions() {
      workspaceSelect.innerHTML = state.workspaces.map(row =>
        `<option value="${escapeHtml(row.workspace_id)}">${escapeHtml(row.label || row.workspace_id)}</option>`
      ).join("");
      workspaceSelect.value = state.workspaceId;
    }

    function updateChrome() {
      const view = state.view;
      health.className = `health ${view.valid ? "valid" : "invalid"}`;
      healthLabel.textContent = view.valid ? "Valid" : "Invalid";
      setCount("claims", view.claims.length);
      setCount("acts", view.research_acts.length);
      setCount("observations", view.observations.length);
      setCount("validation", view.validation_results.length);
      setCount("findings", view.findings.length);
      setCount("activity", view.deterministic_activities.length + view.review_runs.length);
      document.getElementById("sidebar-meta").innerHTML = [
        escapeHtml(view.workspace.workspace_id),
        escapeHtml(shortDigest(view.workspace_revision)),
        escapeHtml(shortDigest(view.operational_revision)),
      ].join("<br>");
    }

    function setCount(name, value) {
      const node = document.querySelector(`[data-count="${name}"]`);
      if (node) node.textContent = String(value);
    }

    function renderCurrentView() {
      document.querySelectorAll("[data-view]").forEach(button => {
        button.classList.toggle("active", button.dataset.view === state.currentView);
      });
      const renderers = {
        overview: renderOverview,
        claims: renderClaims,
        acts: renderActs,
        observations: renderObservations,
        validation: renderValidation,
        findings: renderFindings,
        activity: renderActivity,
      };
      (renderers[state.currentView] || renderOverview)();
      document.getElementById("workspace-main").scrollTop = 0;
    }

    function renderHeader(title, subtitle, searchable = false) {
      return `
        <div class="view-header">
          <div class="view-heading"><h1>${escapeHtml(title)}</h1><p>${escapeHtml(subtitle)}</p></div>
          ${searchable ? `<div class="view-tools"><input class="search-input" id="search-input" type="search" value="${escapeHtml(state.query)}" placeholder="Filter" aria-label="Filter"></div>` : ""}
        </div>`;
    }

    function renderOverview() {
      const view = state.view;
      const summary = state.graph.semantic_summary;
      content.innerHTML = [
        renderHeader(view.label, `${view.workspace.kernel_protocol} · ${shortDigest(view.workspace_revision)}`),
        renderNotices(),
        `<div class="metrics">
          ${metric(summary.claim_count, "Claims")}
          ${metric(summary.act_count, "Research Acts")}
          ${metric(summary.observation_count, "Observations")}
          ${metric(summary.validation_result_count, "Validation Results")}
          ${metric(summary.open_finding_count, "Open Findings")}
          ${metric(summary.current_acceptance_count, "Current Acceptances")}
        </div>`,
        graphSection("Claim graph", state.graph.claim_graph, "claim"),
        graphSection("ResearchAct DAG", state.graph.research_act_dag, "act"),
        recentActivitySection(),
      ].join("");
      requestAnimationFrame(drawAllGraphs);
    }

    function renderNotices() {
      const rows = [];
      if (!state.view.valid) {
        rows.push(notice("error", "!", `${state.view.validation_findings.length} workspace validation finding(s)`, "Workspace invalid"));
      }
      if (state.view.unresolved_controls.length) {
        rows.push(notice("error", "!", `${state.view.unresolved_controls.length} unresolved remote control effect(s)`, "Reconcile only"));
      }
      if (state.view.pending_review_dispositions.length) {
        rows.push(notice("info", "◇", `${state.view.pending_review_dispositions.length} Review response(s) pending`, "Root disposition"));
      }
      if (state.view.acceptance_summary.stale_refs.length) {
        rows.push(notice("info", "i", `${state.view.acceptance_summary.stale_refs.length} historical acceptance record(s) are no longer current`, "Reassess before reporting accepted"));
      }
      return rows.length ? `<div class="notice-stack">${rows.join("")}</div>` : "";
    }

    function notice(kind, symbol, message, tail) {
      return `<div class="notice ${kind}"><span>${symbol}</span><span>${escapeHtml(message)}</span><code>${escapeHtml(tail)}</code></div>`;
    }

    function metric(value, label) {
      return `<div class="metric"><div class="metric-value">${escapeHtml(value)}</div><div class="metric-label">${escapeHtml(label)}</div></div>`;
    }

    function graphSection(title, graph, kind) {
      return `<section class="section">
        <div class="section-header"><h2>${escapeHtml(title)}</h2><span class="section-meta">${graph.nodes.length} records · ${graph.edges.length} relations</span></div>
        ${graph.nodes.length ? `<div class="graph-viewport"><div class="graph-stage" data-graph-kind="${kind}"></div></div>` : `<div class="empty-state">No records</div>`}
      </section>`;
    }

    function drawAllGraphs() {
      document.querySelectorAll("[data-graph-kind]").forEach(stage => {
        const kind = stage.dataset.graphKind;
        const graph = kind === "claim" ? state.graph.claim_graph : state.graph.research_act_dag;
        drawGraph(stage, graph, kind);
      });
    }

    function drawGraph(stage, graph, kind) {
      const layers = graphLayers(graph.nodes, graph.edges);
      const columns = Math.max(1, ...layers.values()) + 1;
      const grouped = Array.from({ length: columns }, () => []);
      graph.nodes.forEach(node => grouped[layers.get(node.id) || 0].push(node));
      grouped.forEach(group => group.sort((a, b) => String(a.id).localeCompare(String(b.id))));
      const width = Math.max(stage.parentElement.clientWidth - 2, columns * 245 + 30);
      const height = Math.max(270, Math.max(...grouped.map(group => group.length), 1) * 94 + 36);
      stage.style.width = `${width}px`;
      stage.style.height = `${height}px`;

      const positions = new Map();
      grouped.forEach((group, column) => group.forEach((node, row) => {
        positions.set(node.id, { x: 20 + column * 245, y: 20 + row * 94 });
      }));

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      graph.edges.forEach(edge => {
        const source = positions.get(edge.source);
        const target = positions.get(edge.target);
        if (!source || !target) return;
        const x1 = source.x + 205;
        const y1 = source.y + 34;
        const x2 = target.x;
        const y2 = target.y + 34;
        const bend = Math.max(24, (x2 - x1) / 2);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}`);
        path.setAttribute("class", `graph-edge ${kind}`);
        svg.appendChild(path);
      });
      stage.replaceChildren(svg);

      graph.nodes.forEach(node => {
        const position = positions.get(node.id);
        const button = document.createElement("button");
        const status = node.status || "unknown";
        button.type = "button";
        button.className = `graph-node status-${toneToken(status)}${node.focus ? " focus" : ""}${node.accepted ? " accepted" : ""}`;
        button.style.left = `${position.x}px`;
        button.style.top = `${position.y}px`;
        button.dataset.detail = kind;
        button.dataset.id = node.id;
        const title = kind === "claim" ? node.statement : node.objective;
        button.innerHTML = `<div class="node-top"><span class="node-id">${escapeHtml(shortId(node.id))}</span><span class="node-state">${escapeHtml(status)}</span></div><div class="node-title">${escapeHtml(title || node.id)}</div>`;
        stage.appendChild(button);
      });
    }

    function graphLayers(nodes, edges) {
      const ids = new Set(nodes.map(node => node.id));
      const incoming = new Map(nodes.map(node => [node.id, 0]));
      const outgoing = new Map(nodes.map(node => [node.id, []]));
      edges.forEach(edge => {
        if (!ids.has(edge.source) || !ids.has(edge.target)) return;
        incoming.set(edge.target, incoming.get(edge.target) + 1);
        outgoing.get(edge.source).push(edge.target);
      });
      const queue = [...ids].filter(id => incoming.get(id) === 0).sort();
      const layer = new Map(queue.map(id => [id, 0]));
      while (queue.length) {
        const current = queue.shift();
        outgoing.get(current).forEach(target => {
          layer.set(target, Math.max(layer.get(target) || 0, (layer.get(current) || 0) + 1));
          incoming.set(target, incoming.get(target) - 1);
          if (incoming.get(target) === 0) queue.push(target);
        });
        queue.sort();
      }
      [...ids].forEach(id => { if (!layer.has(id)) layer.set(id, 0); });
      return layer;
    }

    function renderClaims() {
      const rows = filterRows(state.view.claims, ["claim_id", "claim_type", "statement", "status", "tags"]);
      content.innerHTML = renderHeader("Claims", "Versioned scientific statements and their current support state.", true) +
        table(["Claim", "Type", "Statement", "Status", "Validation"], rows.map(row => ({
          detail: "claim", id: row.claim_id,
          cells: [mono(shortId(row.claim_id)), escapeHtml(row.claim_type), `<div class="truncate">${escapeHtml(row.statement)}</div>`, badge(row.status), `${row.validation_result_refs.length} result(s)`],
        })));
      bindSearch();
    }

    function renderActs() {
      const rows = filterRows(state.view.research_acts, ["act_id", "objective", "status", "tags", "claim_refs"]);
      content.innerHTML = renderHeader("Research Acts", "Dependency-aware research actions owned by the v4 kernel.", true) +
        table(["Act", "Objective", "Status", "Dependencies", "Operations"], rows.map(row => ({
          detail: "act", id: row.act_id,
          cells: [mono(shortId(row.act_id)), `<div class="truncate">${escapeHtml(row.objective)}</div>`, badge(row.status), String(row.dependency_refs.length), `${row.activities.length} activity · ${row.review_runs.length} Review`],
        })));
      bindSearch();
    }

    function renderObservations() {
      const rows = filterRows(state.view.observations, ["observation_id", "concept_id", "subject_ref", "summary", "datatype"]);
      content.innerHTML = renderHeader("Observations", "Semantic parser outputs with artifact-bound provenance.", true) +
        table(["Observation", "Concept", "Subject", "Value", "Act"], rows.map(row => ({
          detail: "observation", id: row.observation_id,
          cells: [mono(shortId(row.observation_id)), mono(row.concept_id), `<div class="truncate">${escapeHtml(row.subject_ref)}</div>`, `<div class="truncate">${escapeHtml(formatValue(row.value))}</div>`, mono(shortId(row.created_by_act))],
        })));
      bindSearch();
    }

    function renderValidation() {
      const specs = filterRows(state.view.validation_specs, ["spec_id", "dimension", "title", "target_claim_ref"]);
      const results = filterRows(state.view.validation_results, ["result_id", "dimension", "verdict", "target_claim_ref"]);
      content.innerHTML = renderHeader("Validation", "Frozen GateSpecs and deterministic evaluation results.", true) +
        `<section class="section"><div class="section-header"><h2>GateSpecs</h2><span class="section-meta">${specs.length}</span></div>${table(["Spec", "Dimension", "Title", "Checks", "Claim"], specs.map(row => ({
          detail: "validation-spec", id: row.spec_id,
          cells: [mono(shortId(row.spec_id)), mono(row.dimension), escapeHtml(row.title), String(row.checks.length), mono(shortId(row.target_claim_ref))],
        })))}</section>` +
        `<section class="section"><div class="section-header"><h2>Validation Results</h2><span class="section-meta">${results.length}</span></div>${table(["Result", "Dimension", "Verdict", "Checks", "Claim"], results.map(row => ({
          detail: "validation-result", id: row.result_id,
          cells: [mono(shortId(row.result_id)), mono(row.dimension), badge(row.verdict), String(row.check_results.length), mono(shortId(row.target_claim_ref))],
        })))}</section>` +
        `<section class="section"><div class="section-header"><h2>Acceptance History</h2><span class="section-meta">${state.view.current_acceptances.length} current · ${state.view.acceptances.length} records</span></div>${table(["Acceptance", "Claim", "Profile", "Results", "State", "Recorded"], state.view.acceptances.map(row => ({
          detail: "acceptance", id: row.acceptance_id,
          cells: [mono(shortId(row.acceptance_id)), mono(shortId(row.claim_ref)), mono(`${row.profile_ref.profile_id}/${row.profile_ref.version}`), String(row.validation_result_refs.length), badge(row.current ? "current" : "historical"), escapeHtml(formatTime(row.accepted_at))],
        })))}</section>`;
      bindSearch();
    }

    function renderFindings() {
      const rows = filterRows(state.view.findings, ["finding_id", "finding_type", "severity", "status", "statement"]);
      content.innerHTML = renderHeader("Findings", "Open anomalies, limitations, and their audited resolutions.", true) +
        table(["Finding", "Type", "Statement", "Severity", "Status"], rows.map(row => ({
          detail: "finding", id: row.finding_id,
          cells: [mono(shortId(row.finding_id)), mono(row.finding_type), `<div class="truncate">${escapeHtml(row.statement)}</div>`, badge(row.severity), badge(row.status)],
        })));
      bindSearch();
    }

    function renderActivity() {
      const activities = filterRows(state.view.deterministic_activities, ["activity_id", "kind", "operation", "status", "summary", "act_refs"]);
      const reviews = filterRows(state.view.review_runs, ["task_id", "operation", "status", "summary", "claim_refs", "act_refs"]);
      content.innerHTML = renderHeader("Activity", "Deterministic host operations and isolated advisory Review runs.", true) +
        `<section class="section"><div class="section-header"><h2>Deterministic</h2><span class="section-meta">${activities.length}</span></div>${activityList(activities, false)}</section>` +
        `<section class="section"><div class="section-header"><h2>Review</h2><span class="section-meta">${reviews.length}</span></div>${activityList(reviews, true)}</section>` +
        controlsSection();
      bindSearch();
    }

    function recentActivitySection() {
      const combined = [
        ...state.view.deterministic_activities.map(row => ({ ...row, _review: false, _time: row.completed_at || row.started_at })),
        ...state.view.review_runs.map(row => ({ ...row, _review: true, _time: row.finished_at || row.started_at })),
      ].sort((a, b) => String(b._time || "").localeCompare(String(a._time || ""))).slice(0, 8);
      if (!combined.length) return "";
      return `<section class="section"><div class="section-header"><h2>Recent activity</h2><span class="section-meta">${combined.length}</span></div>${activityList(combined, null)}</section>`;
    }

    function activityList(rows, forceReview) {
      if (!rows.length) return `<div class="empty-state">No records</div>`;
      return `<div class="activity-list">${rows.map(row => {
        const isReview = forceReview === null ? Boolean(row._review) : forceReview;
        const id = isReview ? row.task_id : row.activity_id;
        const kind = isReview ? "Review" : (row.kind || "Activity");
        const operation = row.operation || "operation";
        const summary = row.summary || row.error_message || row.error_code || "No summary";
        const time = isReview ? (row.finished_at || row.started_at) : (row.completed_at || row.started_at);
        return `<div class="activity-row ${isReview ? "review" : ""}" data-detail="${isReview ? "review" : "activity"}" data-id="${escapeHtml(id)}">
          <span class="activity-symbol">${isReview ? "◇" : "●"}</span>
          <span class="activity-kind">${escapeHtml(kind)}</span>
          <span class="activity-title"><strong>${escapeHtml(operation)} · ${escapeHtml(row.status || "pending")}</strong><span>${escapeHtml(summary)}</span></span>
          <span class="activity-time">${escapeHtml(formatTime(time))}</span>
        </div>`;
      }).join("")}</div>`;
    }

    function controlsSection() {
      const rows = state.view.unresolved_controls;
      if (!rows.length) return "";
      return `<section class="section"><div class="section-header"><h2>Unresolved controls</h2><span class="section-meta">${rows.length}</span></div>${table(["Intent", "Operation", "State", "Error", "Disposition"], rows.map(row => ({
        detail: "control", id: `${row.intent_id}:${row.operation}`,
        cells: [mono(row.intent_id), escapeHtml(row.operation), badge(row.state), badge(row.error_class), mono(row.retry_disposition || "")],
      })))}</section>`;
    }

    function table(headers, rows) {
      if (!rows.length) return `<div class="empty-state">No records</div>`;
      return `<div class="table-scroll"><table class="data-table"><thead><tr>${headers.map(value => `<th>${escapeHtml(value)}</th>`).join("")}</tr></thead><tbody>${rows.map(row =>
        `<tr${row.detail ? ` data-detail="${escapeHtml(row.detail)}" data-id="${escapeHtml(row.id)}"` : ""}>${row.cells.map(cell => `<td>${cell}</td>`).join("")}</tr>`
      ).join("")}</tbody></table></div>`;
    }

    function bindSearch() {
      const input = document.getElementById("search-input");
      if (!input) return;
      input.addEventListener("input", event => {
        state.query = event.target.value;
        renderCurrentView();
        const replacement = document.getElementById("search-input");
        replacement.focus();
        replacement.setSelectionRange(replacement.value.length, replacement.value.length);
      });
    }

    function filterRows(rows, keys) {
      const query = state.query.trim().toLowerCase();
      if (!query) return rows;
      return rows.filter(row => keys.some(key => JSON.stringify(row[key] ?? "").toLowerCase().includes(query)));
    }

    async function openDetail(kind, id) {
      document.body.classList.add("inspector-open");
      inspectorTitle.textContent = labelForKind(kind);
      inspectorBody.innerHTML = `<div class="muted">Loading…</div>`;
      try {
        let payload;
        if (kind === "claim" || kind === "act") {
          payload = await api(`/api/workspace/${encodeURIComponent(state.workspaceId)}/${kind}/${encodeURIComponent(id)}`);
        } else {
          payload = localRecord(kind, id);
        }
        inspectorBody.innerHTML = renderDetail(kind, payload);
      } catch (error) {
        inspectorBody.innerHTML = `<div class="fatal">${escapeHtml(error.message || String(error))}</div>`;
      }
    }

    function localRecord(kind, id) {
      const maps = {
        observation: [state.view.observations, "observation_id"],
        "validation-spec": [state.view.validation_specs, "spec_id"],
        "validation-result": [state.view.validation_results, "result_id"],
        finding: [state.view.findings, "finding_id"],
        acceptance: [state.view.acceptances, "acceptance_id"],
        activity: [state.view.deterministic_activities, "activity_id"],
        review: [state.view.review_runs, "task_id"],
      };
      if (kind === "control") {
        return state.view.unresolved_controls.find(row => `${row.intent_id}:${row.operation}` === id) || {};
      }
      const [rows, key] = maps[kind] || [[], "id"];
      return rows.find(row => row[key] === id) || {};
    }

    function renderDetail(kind, payload) {
      if (kind === "claim") return renderClaimDetail(payload);
      if (kind === "act") return renderActDetail(payload);
      const id = recordId(payload);
      return `<div class="detail-id">${escapeHtml(id)}</div>${detailFields(payload)}`;
    }

    function renderClaimDetail(payload) {
      const claim = payload.claim;
      return `
        <div class="detail-id">${escapeHtml(claim.claim_id)}</div>
        <div class="detail-title">${escapeHtml(claim.statement)}</div>
        ${detailFields({ type: claim.claim_type, status: claim.status, assumptions: claim.assumptions, falsifiers: claim.falsifiers, tags: claim.tags })}
        ${relatedSection("Research Acts", payload.research_acts, "act_id", "objective")}
        ${relatedSection("Validation", payload.validation_results, "result_id", "verdict")}
        ${relatedSection("Findings", payload.findings, "finding_id", "statement")}
        ${relatedSection("Review", payload.review_runs, "task_id", "summary")}`;
    }

    function renderActDetail(payload) {
      const act = payload.research_act;
      return `
        <div class="detail-id">${escapeHtml(act.act_id)}</div>
        <div class="detail-title">${escapeHtml(act.objective)}</div>
        ${detailFields({ status: act.status, tags: act.tags, dependency_refs: act.dependency_refs, claim_refs: act.claim_refs, result: act.result })}
        ${relatedSection("Observations", payload.observations, "observation_id", "summary")}
        ${relatedSection("Validation", payload.validation_results, "result_id", "verdict")}
        ${relatedSection("Findings", payload.findings, "finding_id", "statement")}
        ${relatedSection("Deterministic activity", act.activities || [], "activity_id", "summary")}
        ${relatedSection("Review", act.review_runs || [], "task_id", "summary")}
        ${filesSection(payload.files?.files || [])}`;
    }

    function detailFields(record) {
      const entries = Object.entries(record).filter(([, value]) => value !== null && value !== undefined && value !== "" && (!Array.isArray(value) || value.length));
      if (!entries.length) return "";
      return `<section class="detail-section"><h3>Fields</h3><dl class="detail-grid">${entries.map(([key, value]) =>
        `<div class="detail-field"><dt>${escapeHtml(key)}</dt><dd>${formatDetailValue(value)}</dd></div>`
      ).join("")}</dl></section>`;
    }

    function formatDetailValue(value) {
      if (Array.isArray(value)) {
        return `<div class="ref-list">${value.map(item => `<span class="ref-chip">${escapeHtml(formatValue(item))}</span>`).join("")}</div>`;
      }
      if (value && typeof value === "object") return `<pre class="file-preview">${escapeHtml(JSON.stringify(value, null, 2))}</pre>`;
      return escapeHtml(formatValue(value));
    }

    function relatedSection(title, rows, idKey, textKey) {
      if (!rows || !rows.length) return "";
      return `<section class="detail-section"><h3>${escapeHtml(title)}</h3>${rows.map(row =>
        `<div class="detail-field"><dt class="mono">${escapeHtml(shortId(row[idKey]))}</dt><dd>${escapeHtml(formatValue(row[textKey] || row.status || ""))}</dd></div>`
      ).join("")}</section>`;
    }

    function filesSection(files) {
      if (!files.length) return "";
      return `<section class="detail-section"><h3>Files</h3><div>${files.map(file =>
        `<button class="file-button mono" type="button" data-file="${escapeHtml(file.path)}">${escapeHtml(file.path)} · ${formatBytes(file.size)}</button>`
      ).join("")}</div><div id="file-preview"></div></section>`;
    }

    async function previewFile(path) {
      const target = document.getElementById("file-preview");
      if (!target) return;
      target.innerHTML = `<div class="muted">Loading…</div>`;
      try {
        const payload = await api(`/api/workspace/${encodeURIComponent(state.workspaceId)}/file?path=${encodeURIComponent(path)}`);
        target.innerHTML = `<pre class="file-preview">${escapeHtml(payload.text)}</pre>`;
      } catch (error) {
        target.innerHTML = `<div class="fatal">${escapeHtml(error.message || String(error))}</div>`;
      }
    }

    function badge(value) {
      const text = value ?? "unknown";
      return `<span class="badge ${tone(text)}">${escapeHtml(text)}</span>`;
    }

    function tone(value) {
      const token = String(value || "").toLowerCase();
      if (["pass", "supported", "completed", "resolved", "accepted", "success", "current"].includes(token)) return "good";
      if (["fail", "failed", "blocked", "contradicted", "error", "blocking"].includes(token)) return "bad";
      if (["inconclusive", "warning", "unknown", "accepted_risk", "pending", "historical"].includes(token)) return "warn";
      if (["review", "advisory"].includes(token)) return "review";
      return "info";
    }

    function toneToken(value) {
      return String(value || "unknown").toLowerCase().replace(/[^a-z0-9_-]/g, "-");
    }

    function mono(value) { return `<span class="mono">${escapeHtml(value ?? "")}</span>`; }
    function shortId(value) { const text = String(value || ""); return text.length > 18 ? `${text.slice(0, 9)}…${text.slice(-6)}` : text; }
    function shortDigest(value) { const text = String(value || ""); return text.startsWith("sha256:") ? `sha256:${text.slice(7, 17)}` : shortId(text); }
    function formatValue(value) { return typeof value === "string" ? value : JSON.stringify(value); }
    function formatTime(value) { if (!value) return ""; const date = new Date(value); return Number.isNaN(date.valueOf()) ? String(value) : date.toLocaleString(); }
    function formatBytes(value) { if (value < 1024) return `${value} B`; if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KiB`; return `${(value / 1024 / 1024).toFixed(1)} MiB`; }
    function recordId(record) { return record.claim_id || record.act_id || record.observation_id || record.spec_id || record.result_id || record.finding_id || record.acceptance_id || record.activity_id || record.task_id || record.intent_id || "Record"; }
    function labelForKind(kind) { return ({ claim: "Claim", act: "Research Act", observation: "Observation", "validation-spec": "GateSpec", "validation-result": "Validation Result", finding: "Finding", acceptance: "Acceptance", activity: "Deterministic Activity", review: "Review", control: "Remote Control" })[kind] || "Details"; }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[character]);
    }

    function setLoading(loading) { document.body.classList.toggle("loading", loading); }
    function renderFatal(error) { content.innerHTML = `<div class="fatal">${escapeHtml(error.message || String(error))}</div>`; health.className = "health invalid"; healthLabel.textContent = "Unavailable"; }

    document.getElementById("sidebar").addEventListener("click", event => {
      const button = event.target.closest("[data-view]");
      if (!button) return;
      state.currentView = button.dataset.view;
      state.query = "";
      renderCurrentView();
    });

    document.addEventListener("click", event => {
      const detail = event.target.closest("[data-detail]");
      if (detail) openDetail(detail.dataset.detail, detail.dataset.id);
      const file = event.target.closest("[data-file]");
      if (file) previewFile(file.dataset.file);
    });

    workspaceSelect.addEventListener("change", async event => {
      state.workspaceId = event.target.value;
      document.body.classList.remove("inspector-open");
      await loadWorkspace();
    });
    document.getElementById("refresh-button").addEventListener("click", loadWorkspace);
    document.getElementById("close-inspector").addEventListener("click", () => document.body.classList.remove("inspector-open"));
    window.addEventListener("resize", () => { if (state.currentView === "overview") requestAnimationFrame(drawAllGraphs); });

    boot();
  </script>
</body>
</html>
