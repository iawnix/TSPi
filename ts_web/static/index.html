<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TS Hypothesis Explorer</title>
  <style>
    /* =========================================================
       Design Tokens — Linear / Vercel inspired
       ========================================================= */
    :root {
      color-scheme: light dark;

      --font-sans: -apple-system, BlinkMacSystemFont, "Inter var", "Inter",
                   "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "JetBrains Mono", "SF Mono", "Menlo",
                   "Consolas", "Liberation Mono", monospace;

      /* Light palette */
      --bg:            hsl(220, 22%, 98%);
      --bg-grid:       hsl(220, 16%, 94%);
      --surface:       #ffffff;
      --surface-2:     hsl(220, 18%, 97%);
      --surface-3:     hsl(220, 16%, 94%);
      --border:        hsl(220, 14%, 91%);
      --border-strong: hsl(220, 14%, 82%);
      --text:          hsl(222, 28%, 11%);
      --text-2:        hsl(222, 14%, 36%);
      --text-3:        hsl(222, 10%, 55%);
      --text-faint:    hsl(222, 10%, 70%);

      --accent:        hsl(214, 88%, 54%);
      --accent-hover:  hsl(214, 88%, 47%);
      --accent-soft:   hsl(214, 90%, 96%);
      --accent-fg:     #ffffff;
      --ring:          hsla(214, 88%, 54%, .35);

      --green:         hsl(150, 56%, 38%);
      --green-soft:    hsl(150, 56%, 95%);
      --red:           hsl(354, 70%, 50%);
      --red-soft:      hsl(354, 70%, 96%);
      --amber:         hsl(36, 96%, 46%);
      --amber-soft:    hsl(36, 96%, 95%);
      --purple:        hsl(258, 60%, 55%);
      --purple-soft:   hsl(258, 60%, 96%);
      --cyan:          hsl(190, 75%, 42%);
      --cyan-soft:     hsl(190, 75%, 95%);
      --grey:          hsl(220, 9%, 46%);
      --grey-soft:     hsl(220, 14%, 95%);

      --shadow-xs: 0 1px 1px rgba(15, 23, 42, .04);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05), 0 1px 3px rgba(15, 23, 42, .06);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, .08), 0 1px 3px rgba(15, 23, 42, .04);
      --shadow-lg: 0 16px 40px rgba(15, 23, 42, .14), 0 4px 12px rgba(15, 23, 42, .06);

      --r-xs: 4px;
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 12px;
      --r-pill: 999px;

      --t-fast: 120ms;
      --t-base: 200ms;
      --t-slow: 320ms;
      --ease: cubic-bezier(.2, 0, 0, 1);

      --h-header: 52px;
      --h-toolbar: 44px;
      --w-left: 320px;
      --w-right: 420px;
      --w-left-min: 240px;
      --w-left-max: 560px;
      --w-right-min: 320px;
      --w-right-max: 720px;
    }

    /* Dark palette — applied either by media query (auto) or explicit attribute */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:            hsl(222, 24%, 7%);
        --bg-grid:       hsl(222, 18%, 13%);
        --surface:       hsl(222, 18%, 10%);
        --surface-2:     hsl(222, 16%, 13%);
        --surface-3:     hsl(222, 14%, 16%);
        --border:        hsl(222, 14%, 20%);
        --border-strong: hsl(222, 14%, 28%);
        --text:          hsl(220, 16%, 94%);
        --text-2:        hsl(220, 10%, 72%);
        --text-3:        hsl(220, 8%, 52%);
        --text-faint:    hsl(220, 8%, 40%);

        --accent:        hsl(214, 92%, 64%);
        --accent-hover:  hsl(214, 92%, 70%);
        --accent-soft:   hsl(214, 60%, 18%);
        --accent-fg:     hsl(222, 28%, 8%);
        --ring:          hsla(214, 92%, 64%, .45);

        --green:         hsl(150, 62%, 50%);
        --green-soft:    hsl(150, 50%, 14%);
        --red:           hsl(354, 78%, 64%);
        --red-soft:      hsl(354, 50%, 18%);
        --amber:         hsl(36, 96%, 60%);
        --amber-soft:    hsl(36, 60%, 16%);
        --purple:        hsl(258, 70%, 70%);
        --purple-soft:   hsl(258, 40%, 20%);
        --cyan:          hsl(190, 80%, 55%);
        --cyan-soft:     hsl(190, 50%, 16%);
        --grey:          hsl(220, 8%, 60%);
        --grey-soft:     hsl(220, 12%, 18%);

        --shadow-xs: 0 1px 1px rgba(0, 0, 0, .3);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35), 0 1px 3px rgba(0, 0, 0, .25);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, .4), 0 1px 3px rgba(0, 0, 0, .3);
        --shadow-lg: 0 16px 40px rgba(0, 0, 0, .55), 0 4px 12px rgba(0, 0, 0, .35);
      }
    }

    [data-theme="dark"] {
      --bg:            hsl(222, 24%, 7%);
      --bg-grid:       hsl(222, 18%, 13%);
      --surface:       hsl(222, 18%, 10%);
      --surface-2:     hsl(222, 16%, 13%);
      --surface-3:     hsl(222, 14%, 16%);
      --border:        hsl(222, 14%, 20%);
      --border-strong: hsl(222, 14%, 28%);
      --text:          hsl(220, 16%, 94%);
      --text-2:        hsl(220, 10%, 72%);
      --text-3:        hsl(220, 8%, 52%);
      --text-faint:    hsl(220, 8%, 40%);

      --accent:        hsl(214, 92%, 64%);
      --accent-hover:  hsl(214, 92%, 70%);
      --accent-soft:   hsl(214, 60%, 18%);
      --accent-fg:     hsl(222, 28%, 8%);
      --ring:          hsla(214, 92%, 64%, .45);

      --green:         hsl(150, 62%, 50%);
      --green-soft:    hsl(150, 50%, 14%);
      --red:           hsl(354, 78%, 64%);
      --red-soft:      hsl(354, 50%, 18%);
      --amber:         hsl(36, 96%, 60%);
      --amber-soft:    hsl(36, 60%, 16%);
      --purple:        hsl(258, 70%, 70%);
      --purple-soft:   hsl(258, 40%, 20%);
      --cyan:          hsl(190, 80%, 55%);
      --cyan-soft:     hsl(190, 50%, 16%);
      --grey:          hsl(220, 8%, 60%);
      --grey-soft:     hsl(220, 12%, 18%);

      --shadow-xs: 0 1px 1px rgba(0, 0, 0, .3);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35), 0 1px 3px rgba(0, 0, 0, .25);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, .4), 0 1px 3px rgba(0, 0, 0, .3);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, .55), 0 4px 12px rgba(0, 0, 0, .35);
    }

    /* =========================================================
       Base
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    html { overflow: hidden; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.005em;
    }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, pre { font-family: var(--font-mono); font-size: 12.5px; }

    ::selection { background: var(--accent); color: var(--accent-fg); }

    /* Focus ring */
    :where(button, select, [tabindex]):focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
      border-radius: var(--r-sm);
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: var(--r-pill);
      border: 2px solid var(--bg);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

    /* =========================================================
       App shell
       ========================================================= */
    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: var(--w-left) minmax(440px, 1fr) var(--w-right);
      grid-template-rows: var(--h-header) 1fr;
      grid-template-areas:
        "header header header"
        "left   main   right";
    }
    .app.left-collapsed  { grid-template-columns: 44px minmax(440px, 1fr) var(--w-right); }
    .app.right-collapsed { grid-template-columns: var(--w-left) minmax(440px, 1fr) 44px; }
    .app.left-collapsed.right-collapsed {
      grid-template-columns: 44px minmax(440px, 1fr) 44px;
    }

    @media (max-width: 1180px) {
      :root { --w-left: 280px; --w-right: 380px; }
    }
    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: var(--h-header) auto 1fr auto;
        grid-template-areas: "header" "left" "main" "right";
      }
      .app.left-collapsed, .app.right-collapsed { grid-template-columns: 1fr; }
    }

    /* =========================================================
       Header
       ========================================================= */
    header.topbar {
      grid-area: header;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 5;
      backdrop-filter: saturate(180%) blur(8px);
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 600; font-size: 14px; letter-spacing: -0.01em;
    }
    .brand-mark {
      width: 22px; height: 22px;
      display: inline-grid; place-items: center;
      border-radius: var(--r-sm);
      background: linear-gradient(135deg, var(--accent), hsl(258, 70%, 60%));
      color: white;
      font-weight: 700; font-size: 11px;
      letter-spacing: 0;
      box-shadow: var(--shadow-sm);
    }
    .topbar-mid {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      min-width: 0;
    }
    .topbar-actions {
      display: flex; align-items: center; gap: 6px;
    }

    /* Workspace chip / selector */
    .ws-chip {
      display: inline-flex; align-items: center; gap: 8px;
      max-width: 480px; min-width: 0;
      height: 32px; padding: 0 10px 0 12px;
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
      position: relative;
    }
    .ws-chip:hover { background: var(--surface-3); border-color: var(--border-strong); }
    .ws-chip[aria-expanded="true"] { border-color: var(--accent); }
    .ws-chip-label {
      font-weight: 550; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0;
    }
    .ws-chip-meta {
      color: var(--text-3); font-size: 12px;
      white-space: nowrap;
    }
    .ws-chip-meta::before { content: "·"; margin: 0 6px; color: var(--text-faint); }
    .ws-chip svg { color: var(--text-3); flex-shrink: 0; }

    /* Workspace dropdown popover */
    .ws-pop {
      position: absolute; top: calc(100% + 6px); left: 0;
      min-width: 320px; max-width: 540px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-lg);
      padding: 6px;
      display: none;
      z-index: 50;
      max-height: 400px;
      overflow: auto;
    }
    .ws-pop.open { display: block; }
    .ws-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      padding: 8px 10px;
      border-radius: var(--r-sm);
      cursor: pointer;
      align-items: baseline;
    }
    .ws-item:hover { background: var(--surface-2); }
    .ws-item[aria-selected="true"] {
      background: transparent;
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .ws-item-name {
      font-weight: 550; color: var(--text);
      grid-column: 1;
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ws-item-meta {
      grid-column: 1 / -1;
      color: var(--text-3); font-size: 12px;
      min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .workspace-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .workspace-card {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 10px;
      padding: 8px 9px;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      background: var(--surface);
      text-align: left;
      align-items: baseline;
      transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
    }
    .workspace-card:hover {
      background: var(--surface-2);
      border-color: var(--border-strong);
    }
    .workspace-card[aria-current="true"] {
      border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .workspace-card-name {
      font-weight: 560;
      font-size: 12.5px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .workspace-card-meta {
      grid-column: 1 / -1;
      color: var(--text-3);
      font-size: 11.5px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Icon button */
    .iconbtn {
      width: 32px; height: 32px;
      display: inline-grid; place-items: center;
      border-radius: var(--r-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-2);
      transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
    }
    .iconbtn:hover { background: var(--surface-2); color: var(--text); }
    .iconbtn[aria-pressed="true"] {
      background: transparent;
      border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
      color: var(--accent);
    }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 12px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 500;
      transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
    }
    .btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .btn-primary {
      background: transparent;
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
    }
    .btn-primary:hover {
      background: transparent;
      color: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .kbd {
      display: inline-flex; align-items: center;
      height: 18px; padding: 0 5px;
      font-family: var(--font-mono); font-size: 11px;
      color: var(--text-2);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: var(--r-xs);
    }

    /* =========================================================
       Panels (sidebars)
       ========================================================= */
    aside.panel {
      background: var(--surface);
      overflow: hidden;
      display: flex; flex-direction: column;
      min-width: 0;
      position: relative;
    }
    aside.panel.left  { grid-area: left;  border-right: 1px solid var(--border); }
    aside.panel.right { grid-area: right; border-left: 1px solid var(--border); }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
    }
    .panel-title svg { color: var(--text-3); }
    .panel-body {
      flex: 1;
      overflow: auto;
      padding: 14px;
    }
    .app.left-collapsed  aside.left  .panel-head,
    .app.right-collapsed aside.right .panel-head { padding: 12px 6px; justify-content: center; }
    .app.left-collapsed  aside.left  .panel-body,
    .app.right-collapsed aside.right .panel-body,
    .app.left-collapsed  aside.left  .panel-title,
    .app.right-collapsed aside.right .panel-title { display: none; }
    .panel-resizer {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 10px;
      z-index: 6;
      cursor: col-resize;
      touch-action: none;
    }
    aside.left .panel-resizer { right: -5px; }
    aside.right .panel-resizer { left: -5px; }
    .panel-resizer::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 4px;
      width: 2px;
      background: transparent;
      transition: background var(--t-fast) var(--ease);
    }
    .panel-resizer:hover::after,
    .panel-resizer.dragging::after { background: var(--accent); }
    body.resizing-panels {
      cursor: col-resize;
      user-select: none;
    }
    .app.left-collapsed aside.left .panel-resizer,
    .app.right-collapsed aside.right .panel-resizer { display: none; }

    /* Section */
    .section { margin-bottom: 18px; }
    .section:last-child { margin-bottom: 0; }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .section-title {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
    }
    .section-title .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-faint);
    }
    .section-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 6px;
      font-size: 11px; font-weight: 550;
      border-radius: var(--r-pill);
      background: var(--surface-2);
      color: var(--text-2);
    }

    /* Key-Value list */
    .kv {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 6px 12px;
      align-items: baseline;
    }
    .kv .k {
      color: var(--text-3);
      font-size: 12px;
      font-weight: 500;
    }
    .kv .v {
      color: var(--text);
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .kv .v.mono { font-family: var(--font-mono); font-size: 12.5px; }

    /* Fact list */
    .factlist { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
    .factlist li {
      display: grid; grid-template-columns: 14px 1fr; gap: 8px;
      padding: 6px 8px;
      border-radius: var(--r-sm);
      align-items: baseline;
      line-height: 1.45;
    }
    .factlist li:hover { background: var(--surface-2); }
    .factlist li::before {
      content: "";
      width: 6px; height: 6px;
      margin-top: 7px;
      border-radius: 50%;
      background: var(--text-faint);
      justify-self: center;
    }
    .factlist.ok    li::before { background: var(--green); }
    .factlist.warn  li::before { background: var(--amber); }
    .factlist.err   li::before { background: var(--red); }
    .factlist.q     li::before { background: var(--purple); }
    .factlist .muted { color: var(--text-3); font-style: italic; }

    /* =========================================================
       Status chips
       ========================================================= */
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 22px; padding: 0 8px;
      border-radius: var(--r-pill);
      font-size: 11.5px; font-weight: 550;
      background: transparent;
      color: var(--text-2);
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .chip::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      opacity: .9;
    }
    .chip.no-dot::before { display: none; }
    .chip.size-sm { height: 18px; padding: 0 6px; font-size: 10.5px; }

    /* Chip palette is keyed by the server-side color token emitted by the
       normalizer (`ts-explorer-graph`); the UI never maps chemistry states
       to colors itself. */
    .chip[data-color="grey"]   { color: var(--grey);   border-color: color-mix(in srgb, var(--grey) 35%, var(--border)); }
    .chip[data-color="cyan"]   { color: var(--cyan);   border-color: color-mix(in srgb, var(--cyan) 35%, var(--border)); }
    .chip[data-color="accent"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
    .chip[data-color="purple"] { color: var(--purple); border-color: color-mix(in srgb, var(--purple) 35%, var(--border)); }
    .chip[data-color="green"]  { color: var(--green);  border-color: color-mix(in srgb, var(--green) 35%, var(--border)); }
    .chip[data-color="red"]    { color: var(--red);    border-color: color-mix(in srgb, var(--red) 35%, var(--border)); }
    .chip[data-color="amber"]  { color: var(--amber);  border-color: color-mix(in srgb, var(--amber) 35%, var(--border)); }
    .chip[data-color="blue"]   { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }

    /* =========================================================
       Main graph area
       ========================================================= */
    main.graph-area {
      grid-area: main;
      display: flex; flex-direction: column;
      min-width: 0; min-height: 0;
      background: var(--bg);
    }
    .graph-toolbar {
      height: var(--h-toolbar);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px;
      gap: 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .legend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .legend .chip { cursor: default; }
    .symbol-legend {
      gap: 5px;
      color: var(--purple);
    }
    .legend-glyph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      font-size: 13px;
      line-height: 1;
      color: currentColor;
    }
    .graph-stats {
      display: flex; align-items: center; gap: 14px;
      color: var(--text-3); font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .graph-stats .sep { color: var(--text-faint); }
    .graph-controls {
      display: flex; align-items: center; gap: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 2px;
    }
    .graph-controls .iconbtn { width: 26px; height: 26px; border-radius: var(--r-xs); }
    .zoom-readout {
      min-width: 44px; text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: 11.5px; color: var(--text-2);
      padding: 0 4px;
    }

    .graph-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      cursor: grab;
      background:
        radial-gradient(circle, var(--bg-grid) 1px, transparent 1px) 0 0 / 24px 24px,
        var(--bg);
    }
    .graph-wrap.dragging { cursor: grabbing; user-select: none; }
    .graph-wrap svg.canvas {
      width: 100%; height: 100%;
      display: block;
      touch-action: none;
    }

    /* Edges — wire + circular endpoints (no arrow heads) */
    .edge-group {
      color: var(--border-strong);
      transition: color var(--t-fast) var(--ease),
                  opacity var(--t-base) var(--ease);
    }
    .edge-group.faded                 { opacity: .14; }
    .edge-group.faded:hover           { opacity: .85; }
    .edge-group.lineage               { color: var(--accent); }
    .edge-group.dependency            { color: var(--cyan); opacity: .58; }
    .edge-group.branch-resolved,
    .edge-group.branch-superseded { opacity: .56; }
    .edge-group:hover              { color: var(--accent); }

    .edge {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke-width var(--t-fast) var(--ease),
                  opacity var(--t-fast) var(--ease);
    }
    .edge.branch,
    .edge.branch_decision,
    .edge.branch_generated { stroke-dasharray: 5 4; opacity: .72; }
    .edge.branch-resolved,
    .edge.branch-superseded { opacity: .52; }
    .edge.dependency { stroke-dasharray: 2 5; opacity: .7; }
    .edge-group:hover .edge  { stroke-width: 2; opacity: 1; }
    .edge.highlighted        { stroke-width: 2.2; }
    .edge.faded              { opacity: .12; }

    /* Endpoint dots — hollow at source, solid at target, so the eye reads flow. */
    .edge-dot {
      transition: opacity var(--t-fast) var(--ease),
                  stroke-width var(--t-fast) var(--ease);
    }
    .edge-dot.source {
      fill: var(--bg);              /* hollow ring that blends with the canvas */
      stroke: currentColor;
      stroke-width: 1.6;
    }
    .edge-dot.target {
      fill: currentColor;           /* solid filled dot at the destination */
      stroke: var(--bg);            /* thin halo so the dot pops on grid bg */
      stroke-width: 0.8;
    }
    .edge-group.branch       .edge-dot,
    .edge-group.branch_decision .edge-dot,
    .edge-group.branch_generated .edge-dot { opacity: .85; }
    .edge-group:hover .edge-dot       { opacity: 1; }
    .edge-group:hover .edge-dot.source { stroke-width: 2; }

    /* Nodes */
    .node {
      cursor: pointer;
      transition: transform var(--t-base) var(--ease),
                  opacity var(--t-base) var(--ease);
    }
    .node.faded             { opacity: .28; }
    .node.faded:hover       { opacity: .82; }
    .node.lineage-ancestor .node-card,
    .node.lineage-descendant .node-card { stroke: var(--accent); stroke-opacity: .35; }
    .node-card {
      fill: var(--surface);
      stroke: var(--border);
      stroke-width: 1;
      filter: drop-shadow(0 1px 2px rgba(15, 23, 42, .04));
      transition: stroke var(--t-fast) var(--ease), filter var(--t-base) var(--ease);
    }
    [data-theme="dark"] .node-card,
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .node-card {
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35));
      }
    }
    .node-stripe { width: 4px; rx: 0; }
    .node:hover .node-card {
      stroke: var(--border-strong);
      filter: drop-shadow(0 6px 16px rgba(15, 23, 42, .12));
    }
    .node.selected .node-card {
      stroke: var(--accent);
      stroke-width: 1.5;
      filter: drop-shadow(0 0 0 4px var(--ring)) drop-shadow(0 6px 16px rgba(15, 23, 42, .12));
    }
    .node.faded { opacity: .35; }

    .node-stage-label {
      font: 600 9.5px var(--font-sans);
      letter-spacing: 0.08em;
      fill: var(--text-3);
      text-transform: uppercase;
    }
    .node:hover .node-stage-label { fill: var(--text-2); }
    .node-id-text {
      font: 600 13px var(--font-sans);
      fill: var(--text);
      letter-spacing: -0.005em;
    }
    .node-status-line {
      font: 600 11.5px var(--font-sans);
    }
    .node-meta-text {
      font: 500 10.5px var(--font-mono);
      fill: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    .node-ev {
      font: 600 10px var(--font-mono);
      fill: var(--text-3);
      letter-spacing: 0;
    }
    .node-ev-bg {
      fill: var(--surface-2);
      stroke: var(--border);
      stroke-width: 1;
    }
    .node-icon {
      stroke: var(--text-3);
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke var(--t-fast) var(--ease);
    }
    .node:hover .node-icon,
    .node.selected .node-icon { stroke: var(--text); }
    .node.selected .node-stripe { width: 6px; }
    .branch-badge { fill: none; stroke: currentColor; stroke-width: 1; }
    .branch-badge-icon {
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .node-frontier-halo { fill: var(--accent); }
    .node-frontier-dot  { fill: var(--accent); }

    /* Mini-map */
    .minimap {
      position: absolute;
      right: 14px; bottom: 14px;
      width: 180px; height: 120px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      pointer-events: none;
      opacity: .92;
    }
    .minimap svg { width: 100%; height: 100%; display: block; }
    .minimap .vp {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 1.2;
      opacity: .85;
    }

    /* Empty / loading */
    .empty {
      display: grid; place-items: center; gap: 8px;
      padding: 32px 16px;
      color: var(--text-3);
      text-align: center;
    }
    .empty svg { opacity: .6; }
    .empty-title { color: var(--text-2); font-weight: 550; font-size: 13px; }
    .empty-hint { font-size: 12px; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* =========================================================
       Right panel — node detail
       ========================================================= */
    .node-head {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .node-head .id { font-weight: 600; font-size: 14px; }

    /* Tabs */
    .tabs {
      position: relative;
      display: flex; gap: 2px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      position: relative;
      padding: 8px 10px;
      font-size: 12.5px; font-weight: 500;
      color: var(--text-2);
      background: transparent;
      border: 0;
      cursor: pointer;
      white-space: nowrap;
      transition: color var(--t-fast) var(--ease);
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: -1px;
      height: 2px;
      background: var(--accent);
      border-radius: 1px 1px 0 0;
    }

    /* Markdown renderer */
    .md { color: var(--text); line-height: 1.65; font-size: 13.5px; }
    .md h1, .md h2, .md h3, .md h4 {
      margin: 18px 0 8px; font-weight: 600; line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .md h1 { font-size: 18px; }
    .md h2 { font-size: 16px; }
    .md h3 { font-size: 14px; color: var(--text); }
    .md h4 { font-size: 13px; color: var(--text-2); }
    .md p { margin: 8px 0; }
    .md ul, .md ol { padding-left: 22px; margin: 8px 0; }
    .md li { margin: 2px 0; }
    .md code:not(pre code) {
      font-family: var(--font-mono); font-size: 12px;
      padding: 1px 5px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-xs);
    }
    .md pre {
      margin: 10px 0; padding: 12px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      overflow-x: auto;
      line-height: 1.5;
    }
    .md blockquote {
      margin: 10px 0; padding: 4px 12px;
      border-left: 3px solid var(--border-strong);
      color: var(--text-2);
    }
    .md hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
    .md strong { font-weight: 600; }
    .md em { color: var(--text-2); }

    /* Summary cards */
    .summary-stack { display: grid; gap: 10px; }
    .summary-card {
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--surface-2);
      padding: 11px 12px;
    }
    .summary-card.primary {
      background: var(--surface);
      border-color: var(--border-strong);
    }
    .summary-title {
      font-size: 11px;
      font-weight: 650;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .summary-text {
      color: var(--text);
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .summary-text.muted { color: var(--text-3); }
    .summary-grid {
      display: grid;
      grid-template-columns: minmax(92px, 120px) 1fr;
      gap: 6px 10px;
    }
    .summary-grid .k {
      color: var(--text-3);
      font-size: 12px;
      min-width: 0;
    }
    .summary-grid .v {
      color: var(--text);
      font-size: 12.5px;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .action-token {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-2);
    }
    .timeline { display: grid; gap: 8px; }
    .timeline-item {
      border-left: 2px solid var(--border-strong);
      padding-left: 10px;
    }
    .timeline-action {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-2);
      overflow-wrap: anywhere;
    }
    .timeline-evidence {
      margin-top: 3px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-3);
      overflow-wrap: anywhere;
    }

    /* JSON viewer */
    .json {
      font-family: var(--font-mono); font-size: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 12px;
      overflow: auto;
      line-height: 1.55;
    }
    .json .k { color: var(--purple); }
    .json .s { color: var(--green); }
    .json .n { color: var(--cyan); }
    .json .b { color: var(--amber); }
    .json .null { color: var(--text-3); }
    .json details summary {
      cursor: pointer; color: var(--text-3);
      user-select: none;
    }
    .json details summary::marker { color: var(--text-faint); }
    .json details[open] summary::after { content: ""; }
    .json details > div { margin-left: 16px; }

    .codebar {
      display: flex; justify-content: flex-end; gap: 4px;
      margin-bottom: -4px;
    }

    /* Files list */
    .files { display: flex; flex-direction: column; gap: 1px; }
    .file-row {
      display: grid;
      grid-template-columns: 16px 1fr auto auto;
      grid-template-rows: auto auto;
      column-gap: 10px;
      row-gap: 1px;
      align-items: baseline;
      padding: 8px 10px;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background var(--t-fast) var(--ease);
    }
    .file-row:hover,
    .file-row:focus-visible { background: var(--surface-2); outline: none; }
    .file-row .file-icon {
      grid-row: 1 / 3;
      align-self: center;
      color: var(--text-3);
    }
    .file-row:hover .file-icon { color: var(--text-2); }
    .file-row .file-name {
      grid-row: 1; grid-column: 2;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 12.5px;
      color: var(--text);
      letter-spacing: -0.005em;
      min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-row .file-size {
      grid-row: 1; grid-column: 3;
      color: var(--text-3);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .file-row .file-action {
      grid-row: 1; grid-column: 4;
      opacity: 0;
      transition: opacity var(--t-fast) var(--ease);
    }
    .file-row:hover .file-action,
    .file-row:focus-within .file-action { opacity: 1; }
    .file-row .file-action .btn { height: 22px; padding: 0 8px; font-size: 11.5px; }
    .file-row .file-path {
      grid-row: 2; grid-column: 2 / -1;
      color: var(--text-3);
      font-family: var(--font-mono);
      font-size: 11px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Toast */
    .toast-wrap {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; gap: 8px;
      z-index: 100; pointer-events: none;
    }
    .toast {
      background: var(--text);
      color: var(--bg);
      padding: 8px 14px;
      border-radius: var(--r-md);
      font-size: 12.5px;
      box-shadow: var(--shadow-lg);
      animation: toast-in 200ms var(--ease);
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .muted { color: var(--text-3); }
    .error { color: var(--red); }
    .nowrap { white-space: nowrap; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">TS</span>
      <span>Hypothesis Explorer</span>
    </div>
    <div class="topbar-mid">
      <div style="position:relative">
        <button class="ws-chip" id="wsChip" aria-haspopup="listbox" aria-expanded="false">
          <span class="ws-chip-label" id="wsChipLabel">—</span>
          <span class="ws-chip-meta" id="wsChipMeta"></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="ws-pop" id="wsPop" role="listbox"></div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="iconbtn" id="refreshBtn" title="Refresh (R)" aria-label="Refresh">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button class="iconbtn" id="themeBtn" title="Toggle theme (T)" aria-label="Toggle theme">
        <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <aside class="panel left" id="leftPanel">
    <div class="panel-resizer" id="leftResizer" role="separator" aria-label="Resize left panel" aria-orientation="vertical" tabindex="0"></div>
    <div class="panel-head">
      <span class="panel-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Workspace
      </span>
      <button class="iconbtn" id="toggleLeft" title="Collapse" aria-label="Collapse left panel" aria-expanded="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <div class="panel-body" id="leftBody">
      <div class="section" id="workspacesSection">
        <div class="section-head">
          <span class="section-title"><span class="dot" style="background:var(--cyan)"></span>Workspaces</span>
          <span class="section-count" id="workspacesCount">0</span>
        </div>
        <div class="workspace-list" id="workspaceList"></div>
      </div>
      <div class="section" id="jobSection">
        <div class="section-head">
          <span class="section-title"><span class="dot" style="background:var(--accent)"></span>Job</span>
        </div>
        <div class="kv" id="jobKv"></div>
      </div>
      <div class="section" id="mechSection">
        <div class="section-head">
          <span class="section-title"><span class="dot" style="background:var(--purple)"></span>Mechanism</span>
        </div>
        <div class="kv" id="mechKv"></div>
      </div>
      <div class="section">
        <div class="section-head">
          <span class="section-title"><span class="dot" style="background:var(--cyan)"></span>Mechanism Analysis</span>
          <span class="section-count" id="analysisCount">0</span>
        </div>
        <ul class="factlist" id="mechanismAnalysis"></ul>
      </div>
      <div class="section">
        <div class="section-head">
          <span class="section-title"><span class="dot" style="background:var(--green)"></span>Validated Facts</span>
          <span class="section-count" id="factsCount">0</span>
        </div>
        <ul class="factlist ok" id="facts"></ul>
      </div>
      <div class="section">
        <div class="section-head">
          <span class="section-title"><span class="dot" style="background:var(--red)"></span>Refuted</span>
          <span class="section-count" id="refutedCount">0</span>
        </div>
        <ul class="factlist err" id="refuted"></ul>
      </div>
      <div class="section">
        <div class="section-head">
          <span class="section-title"><span class="dot" style="background:var(--amber)"></span>Open Questions</span>
          <span class="section-count" id="questionsCount">0</span>
        </div>
        <ul class="factlist q" id="questions"></ul>
      </div>
    </div>
  </aside>

  <main class="graph-area">
    <div class="graph-toolbar">
      <div class="legend" id="graphLegend"></div>
      <div class="graph-stats">
        <span id="graphStats">—</span>
        <span class="sep">|</span>
        <div class="graph-controls" role="group" aria-label="Graph controls">
          <button class="iconbtn" id="zoomOut" title="Zoom out (−)" aria-label="Zoom out">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <span class="zoom-readout" id="zoomReadout">100%</span>
          <button class="iconbtn" id="zoomIn" title="Zoom in (+)" aria-label="Zoom in">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button class="iconbtn" id="zoomFit" title="Fit (F)" aria-label="Fit graph">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V3h4M21 7V3h-4M3 17v4h4M21 17v4h-4"/></svg>
          </button>
          <button class="iconbtn" id="zoomReset" title="Reset (0)" aria-label="Reset view">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="graph-wrap" id="graphWrap" tabindex="0">
      <svg class="canvas" id="graphSvg" role="img" aria-label="TS hypothesis graph">
        <!-- edges use circular endpoints (see .edge-dot) instead of arrow markers -->
        <defs></defs>
        <g id="viewport"></g>
      </svg>
      <div class="minimap" id="minimap" aria-hidden="true">
        <svg id="minimapSvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>
  </main>

  <aside class="panel right" id="rightPanel">
    <div class="panel-resizer" id="rightResizer" role="separator" aria-label="Resize right panel" aria-orientation="vertical" tabindex="0"></div>
    <div class="panel-head">
      <span class="panel-title">

        Node
      </span>
      <button class="iconbtn" id="toggleRight" title="Collapse" aria-label="Collapse right panel" aria-expanded="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
